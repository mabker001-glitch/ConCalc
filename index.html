  if(el.opOnly&&!byRun(v)&&!byOpenings(v)){v.opm=2;if(!Array.isArray(v.ops))v.ops=opRows(v)}
  const conc=S.mode==='conc',k2=isFoot(S.type)&&kindOf(v)===2;
  const fillIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8h5l3 10h4l3-10h5"/><path d="M9 12h6M10 15h4"/><path d="M12 2v5M10 5l2 2 2-2"/></svg>';
  const tabs=S.mode==='fin'
    ?FIN_TABS.map(t=>`<button role="tab" id="el-${t}" aria-selected="${t===S.type}" data-act="type" data-v="${t}">${FIN_ICONS[t]}${elName(t)}</button>`).join('')
    :TABS.map(({t,view})=>{const on=t===S.type&&(!view||view===earthView());
    return`<button role="tab" id="el-${view||t}" aria-selected="${on}" data-act="type" data-v="${t}" ${view?`data-view="${view}"`:''}>${view==='fill'?fillIcon:ICONS[t]}${view?tr(EARTH_VIEW[view].name):elName(t)}</button>`}).join('');
  // each footing type picks its own kind, so isolated and combined footings can sit in one list
  const kinds=isFoot(S.type)?`<div class="kind-switch" role="radiogroup" aria-label="${L('نوع القاعدة','Footing kind')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="footkind" data-v="1" aria-checked="${!k2}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="14" width="14" height="6"/><rect x="10" y="5" width="4" height="9"/></svg>${L('قاعدة منفصلة','Isolated footing')}</button>
      <button type="button" role="radio" data-act="footkind" data-v="2" aria-checked="${k2}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="14" width="20" height="6"/><rect x="5" y="5" width="4" height="9"/><rect x="15" y="5" width="4" height="9"/></svg>${L('قاعدة مشتركة','Combined footing')}</button>
    </div>`:'';
  const field=f=>{
    let ctl;
    if(f.dia)ctl=`<select class="input num" id="f-${f.k}" data-k="${f.k}">${DIAS.map(d=>`<option value="${d}" ${+v[f.k]===d?'selected':''}>Ø${d} · ${fmtF(wpm(d),3)} kg/m</option>`).join('')}</select>`;
    else if(f.select)ctl=`<select class="input" id="f-${f.k}" data-k="${f.k}">${f.select.map(([x,l])=>`<option value="${x}" ${+v[f.k]===x?'selected':''}>${tr(l)}</option>`).join('')}</select>`;
    else ctl=`<input class="input num" id="f-${f.k}" data-k="${f.k}" inputmode="decimal" value="${esc(v[f.k])}" aria-describedby="m-${f.k}">`;
    return`<div class="field" data-f="${f.k}"><label for="f-${f.k}"><span>${tr(typeof f.label==='function'?f.label(v):f.label)}</span><span class="unit">${tr(unitOf(f,v))}</span></label>${ctl}<div class="msg" id="m-${f.k}"></div></div>`};
  const part=concPart(),vis=visibleKeys(S.type,S.mode,v,partOf());
  const partSwitch=part?`<div class="kind-switch" role="radiogroup" aria-label="${L('نوع الخرسانة','Concrete type')}">
      <button type="button" role="radio" data-act="concpart" data-v="rc" aria-checked="${part==='rc'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10"/><path d="M5 14h14M5 10h14" stroke-dasharray="2 2"/></svg>${L('خرسانة مسلحة','Reinforced concrete')}</button>
      <button type="button" role="radio" data-act="concpart" data-v="plain" aria-checked="${part==='plain'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="14" width="20" height="5"/><path d="M6 14v5M11 14v5M16 14v5" opacity=".5"/></svg>${L('خرسانة عادية (نظافة)','Plain concrete (blinding)')}</button>
    </div>`:'';
  const types=`<div class="types">
    <div class="types-head"><b style="font-family:var(--display);font-weight:600">${L('الأنواع','Types')}</b><small>${L(`أضف نوعًا لكل مقاس مختلف، مثل ${pre}1 و${pre}2`,`Add a type for each different size, e.g. ${pre}1 and ${pre}2`)}</small></div>
    <div class="chips">${e.list.map(t=>`<span class="chip ${t.id===e.active?'on':''}" id="chip-${t.id}">
        <button type="button" data-act="seltype" data-v="${t.id}" aria-pressed="${t.id===e.active}"><span class="chip-name">${esc(t.name)||'—'}</span></button>
        ${e.list.length>1?`<button type="button" class="x" data-act="deltype" data-v="${t.id}" aria-label="${L('حذف النوع','Remove type')} ${esc(t.name)}">×</button>`:''}</span>`).join('')}
      <span class="chip chip-add"><button type="button" data-act="addtype">${L('+ إضافة نوع','+ Add type')}</button></span></div>
    <div class="grid-f"><div class="field" data-f="__name"><label for="f-name"><span>${L('اسم النوع','Type name')}</span><span class="unit">${L('مثل','e.g.')} ${pre}1</span></label><input class="input" id="f-name" data-name="1" value="${esc(a.name)}" maxlength="20"><div class="msg"></div></div></div>
  </div>`;
  const ar=S.type==='slab'&&byArea(v);
  const bySwitch=S.type==='slab'?`<div class="kind-switch" role="radiogroup" aria-label="${L('طريقة إدخال السقف','Slab input')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="slabby" data-v="1" aria-checked="${!ar}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12"/><path d="M4 3h16M4 2v2M20 2v2M1 6v12M2 6H0M2 18H0" /></svg>${L('بالطول والعرض','Length × width')}</button>
      <button type="button" role="radio" data-act="slabby" data-v="2" aria-checked="${ar}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h10v6h6v10H4z"/><text x="12" y="17" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial">m²</text></svg>${L('بالمساحة الكلية','Total area')}</button>
    </div>`:'';
  const ff=fromFooting(v);
  const embSwitch=S.type==='column'&&!conc?`<div class="kind-switch" role="radiogroup" aria-label="${L('الطول داخل القاعدة','Depth into the footing')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="embm" data-v="1" aria-checked="${!ff}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16M8 4v16M16 4v16"/><path d="M12 8v8M10 14l2 2 2-2"/></svg>${L('طول داخل القاعدة يدوي','Depth typed in')}</button>
      <button type="button" role="radio" data-act="embm" data-v="2" aria-checked="${ff}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="13" width="18" height="7"/><rect x="9" y="3" width="6" height="10"/><path d="M5 18h14" stroke-dasharray="2 2"/></svg>${L('من أبعاد القاعدة وتسليحها','From the footing & its mesh')}</button>
    </div>`:'';
  const earth=!!el.earth,ek=kindOf(v),fin=!!el.fin;
  const earthSwitch=earth?`<div class="kind-switch" role="radiogroup" aria-label="${L('نوع الحفر','Excavation type')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="earthkind" data-v="1" aria-checked="${ek===1}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6h4l2 14h8l2-14h4"/><rect x="9" y="15" width="6" height="4"/></svg>${L('حفر قاعدة منفردة','Single footing pit')}</button>
      <button type="button" role="radio" data-act="earthkind" data-v="2" aria-checked="${ek===2}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 7h3l1 12h14l1-12h3"/><rect x="7" y="13" width="3" height="6"/><rect x="14" y="13" width="3" height="6"/></svg>${L('حفر مساحة المبنى كاملة','Whole building footprint')}</button>
    </div>`+(ek===2&&earthView()==='exc'?`<div class="kind-switch" role="radiogroup" aria-label="${L('أبعاد المبنى','Building size')}">
      <button type="button" role="radio" data-act="earthby" data-v="1" aria-checked="${+v.by!==2}">${L('بالطول والعرض','Length × width')}</button>
      <button type="button" role="radio" data-act="earthby" data-v="2" aria-checked="${+v.by===2}">${L('بالمساحة الكلية','Total area')}</button>
    </div>`:'')+(ek===2&&earthView()==='fill'?`<div class="kind-switch" role="radiogroup" aria-label="${L('حجم المنشآت المدفونة','Buried volume')}">
      <button type="button" role="radio" data-act="earthbv" data-v="2" aria-checked="${+v.bvm===2}">${L('مربوط بالأساسات والأعمدة','Linked to footings & columns')}</button>
      <button type="button" role="radio" data-act="earthbv" data-v="1" aria-checked="${+v.bvm!==2}">${L('إدخال يدوي','Typed in')}</button>
    </div>`:''):'';
  const tieSwitch=S.type==='tie'?`<div class="kind-switch" role="radiogroup" aria-label="${L('السملات في المشروع','Tie beams in the project')}">
      <button type="button" role="radio" data-act="hastie" data-v="1" aria-checked="${!S.noTie}">${ICONS.tie}${L('يوجد سملات','Has tie beams')}</button>
      <button type="button" role="radio" data-act="hastie" data-v="2" aria-checked="${!!S.noTie}">${L('لا يوجد سملات','No tie beams')}</button>
    </div>`:'';
  // finishes: brick or block (masonry), and count × length or total running metres (wall finishes)
  const finSwitch=fin&&S.type!=='tile'?`<div class="kind-switch" role="radiogroup" aria-label="${L('طريقة إدخال الأطوال','Length input')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="finlm" data-v="1" aria-checked="${!byRun(v)}">${L('حائط حائط','Wall by wall')}</button>
      <button type="button" role="radio" data-act="finlm" data-v="2" aria-checked="${byRun(v)}">${L('إجمالي الأمتار الطولية','Total running metres')}</button>
    </div>`+(byRun(v)?`<div class="kind-switch" role="radiogroup" aria-label="${L('ارتفاع الطابق','Storey height')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="finhi" data-v="1" aria-checked="${!runHasHeight(v)}">${L('غير شاملة ارتفاع الطابق','Without storey height')}</button>
      <button type="button" role="radio" data-act="finhi" data-v="2" aria-checked="${runHasHeight(v)}">${L('شاملة ارتفاع الطابق','Including storey height')}</button>
    </div>`:'')+(el.opOnly&&!byRun(v)?'':`<div class="kind-switch" role="radiogroup" aria-label="${L('طريقة إدخال الفتحات','Openings input')} ${esc(a.name)}">
      <button type="button" role="radio" data-act="finop" data-v="1" aria-checked="${!byOpenings(v)}">${L('إجمالي مساحة الفتحات','Total openings area')}</button>
      <button type="button" role="radio" data-act="finop" data-v="2" aria-checked="${byOpenings(v)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="16"/><rect x="13" y="6" width="8" height="7"/><path d="M17 6v7M13 9.5h8"/></svg>${L('الأبواب والشبابيك','Doors & windows')}</button>
    </div>`):'';
  const form=S.type==='tie'&&S.noTie
    ?tieSwitch+`<p class="hint">${L('المشروع بدون سملات: لا تُحسب لها كميات، ولا يُخصم لها شيء من ردم المبنى. اختر «يوجد سملات» لإدخالها.','This project has no tie beams: nothing is calculated for them and nothing is deducted for them from the building backfill. Choose "Has tie beams" to enter them.')}</p>`
    :tieSwitch+types+finSwitch+earthSwitch+partSwitch+kinds+bySwitch+embSwitch+el.groups.filter(g=>groupOn(g,v)).map(g=>{const fs=g.f.filter(f=>vis.has(f.k));
      // the wall list and the door/window list sit in place of their groups
      return(g.walls&&!byRun(v)?wallEditor(v):'')+(g.open&&byOpenings(v)?opEditor(v):'')+(fs.length?`<fieldset>${g.walls&&!byRun(v)?'':`<legend>${tr(g.t)}</legend>`}<div class="grid-f">${fs.map(field).join('')}</div></fieldset>`:'')}).join('')
    +(conc&&!earth&&!fin?'':`<p class="hint">${tr(k2?el.hint2:el.hint)}${ar?L(' عند الإدخال بالمساحة يُحسب الحديد لمربع بنفس المساحة، فهو تقريبي. للدقة استخدم الطول والعرض.',' With area entry the steel is worked out for a square of the same area, so it is approximate. Use length × width for an exact figure.'):''}</p>`);
  return shell(`<div class="page-head"><div><span class="eyebrow">${fin?L('حساب التشطيبات','Finishes'):earth?L('الأعمال الترابية','Earthworks'):conc?(part==='plain'?L('حساب الخرسانة العادية','Plain concrete calculation'):part==='rc'?L('حساب الخرسانة المسلحة','Reinforced concrete calculation'):L('حساب الخرسانة','Concrete calculation')):L('حساب حديد التسليح','Rebar calculation')}</span><h1>${earth?tr(EARTH_VIEW[earthView()].name):elName(S.type)}</h1></div>
      <div class="actions"><button class="btn ghost" data-act="reset">${L('مسح الأنواع والبدء من جديد','Clear types and start over')}</button></div></div>
    <div class="mode-switch three" role="tablist" aria-label="${L('نوع الحساب','Calculation')}">
      <button role="tab" id="mode-conc" aria-selected="${S.mode==='conc'}" data-act="mode" data-v="conc">${I.cube}<span><b>${L('حساب الخرسانة','Concrete')}</b><small>${L('م³ · الأبعاد فقط','m³ · dimensions only')}</small></span></button>
      <button role="tab" id="mode-steel" aria-selected="${S.mode==='steel'}" data-act="mode" data-v="steel">${I.bars}<span><b>${L('حساب الحديد','Rebar')}</b><small>${L('كغ · طن · أسياخ 12 م','kg · tonnes · 12 m bars')}</small></span></button>
      <button role="tab" id="mode-fin" aria-selected="${S.mode==='fin'}" data-act="mode" data-v="fin">${FIN_ICONS.paint}<span><b>${L('حساب التشطيبات','Finishes')}</b><small>${L('م² · بلوك · لياسة · بلاط · دهان','m² · blocks · plaster · tiles · paint')}</small></span></button>
    </div>
    <div class="el-tabs" role="tablist" aria-label="${L('نوع العنصر','Element type')}">${tabs}</div>
    <div class="calc">
      <form class="sheet" id="calc-form" novalidate>${form}</form>
      <div class="results" id="results"></div>
    </div>`);
}

// wall rows: count, length, height; add one row per different wall
function wallEditor(v){
  const rows=wallRows(v);
  return`<fieldset class="op-list wall-list"><legend>${L('الجدران','Walls')}</legend>
    ${rows.map((r,i)=>`<div class="op-row">
      <span class="wall-no num">${L('جدار','Wall')} ${i+1}</span>
      <label class="op-f"><span>${L('العدد','Count')}</span><input class="input num" id="wl-c-${i}" data-wall="${i}:c" inputmode="decimal" value="${esc(r.c)}"></label>
      <label class="op-f"><span>${L('الطول م','Length m')}</span><input class="input num" id="wl-l-${i}" data-wall="${i}:l" inputmode="decimal" value="${esc(r.l)}"></label>
      <label class="op-f"><span>${L('الارتفاع م','Height m')}</span><input class="input num" id="wl-h-${i}" data-wall="${i}:h" inputmode="decimal" value="${esc(r.h)}"></label>
      <span class="op-a num" id="wl-a-${i}">${fmtF(wallRowArea(r),2)} m²</span>
      <button type="button" class="btn ghost danger op-x" data-act="walldel" data-v="${i}" aria-label="${L('حذف','Remove')}">×</button>
    </div>`).join('')||`<p class="muted" style="font-size:var(--t-sm)">${L('لا توجد جدران. أضف جدارًا.','No walls. Add a wall.')}</p>`}
    <div class="op-foot"><button type="button" class="btn" data-act="walladd">${L('+ إضافة جدار','+ Add wall')}</button>
      <span class="op-total">${L('إجمالي مساحة الجدران','Total wall area')}: <b class="num" id="wl-total">${fmtF(sum(rows,wallRowArea),2)} m²</b></span></div>
  </fieldset>`;
}
// door & window rows: type, count, width, height; add/remove any number of sizes
function opEditor(v){
  const rows=opRows(v);
  return`<fieldset class="op-list"><legend>${L('الأبواب والشبابيك','Doors & windows')}</legend>
    ${rows.map((r,i)=>`<div class="op-row">
      <select class="input" id="op-k-${i}" data-op="${i}:k" aria-label="${L('النوع','Type')}"><option value="d" ${r.k!=='w'?'selected':''}>${L('باب','Door')}</option><option value="w" ${r.k==='w'?'selected':''}>${L('شباك','Window')}</option></select>
      <label class="op-f"><span>${L('العدد','Count')}</span><input class="input num" id="op-n-${i}" data-op="${i}:n" inputmode="decimal" value="${esc(r.n)}"></label>
      <label class="op-f"><span>${L('العرض م','Width m')}</span><input class="input num" id="op-w-${i}" data-op="${i}:w" inputmode="decimal" value="${esc(r.w)}"></label>
      <label class="op-f"><span>${L('الارتفاع م','Height m')}</span><input class="input num" id="op-h-${i}" data-op="${i}:h" inputmode="decimal" value="${esc(r.h)}"></label>
      <span class="op-a num" id="op-a-${i}">${fmtF(opRowArea(r),2)} m²</span>
      <button type="button" class="btn ghost danger op-x" data-act="opdel" data-v="${i}" aria-label="${L('حذف','Remove')}">×</button>
    </div>`).join('')||`<p class="muted" style="font-size:var(--t-sm)">${L('لا توجد فتحات. أضف بابًا أو شباكًا.','No openings. Add a door or a window.')}</p>`}
    <div class="op-foot"><button type="button" class="btn" data-act="opadd" data-v="d">${L('+ إضافة باب','+ Add door')}</button>
      <button type="button" class="btn" data-act="opadd" data-v="w">${L('+ إضافة شباك','+ Add window')}</button>
      <span class="op-total">${L('إجمالي الفتحات','Total openings')}: <b class="num" id="op-total">${fmtF(opArea(v),2)} m²</b></span></div>
  </fieldset>`;
}
function nameErr(t,list){
  const n=(t.name||'').trim();
  if(!n)return L('أدخل اسم النوع.','Enter a type name.');
  if(list.some(o=>o!==t&&(o.name||'').trim()===n))return L('هذا الاسم مستخدم لنوع آخر.','Another type already uses this name.');
  return'';
}

function renderResults(){
  const box=$('#results');if(!box)return;
  if(S.type==='tie'&&S.noTie){box.innerHTML=`<div class="status warn">${I.warn}<span>${L('لا يوجد سملات في هذا المشروع.','This project has no tie beams.')}</span></div>`;S.last=null;return}
  if(ELEMENTS[S.type].earth)syncLinkedBuried();
  const conc=S.mode==='conc',e=E(),a=cur();
  const errMap={};const badTypes=[];
  for(const t of e.list){const x=validate(S.type,t.inputs,S.mode,partOf());const ne=nameErr(t,e.list);if(ne)x.__name=ne;errMap[t.id]=x;if(Object.keys(x).length)badTypes.push(t)}
  const ae=errMap[a.id];
  document.querySelectorAll('#calc-form .field').forEach(f=>{const m=ae[f.dataset.f]||'';f.classList.toggle('err',!!m);f.querySelector('.msg').textContent=m;
    const inp=f.querySelector('input,select');if(inp)inp.setAttribute('aria-invalid',m?'true':'false')});
  for(const t of e.list){const c=document.getElementById('chip-'+t.id);if(c)c.classList.toggle('err',!!Object.keys(errMap[t.id]).length)}
  // labels that show a computed value (e.g. lap length in metres) follow the inputs
  for(const g of ELEMENTS[S.type].groups)for(const f of g.f)if(typeof f.label==='function'){
    const sp=document.querySelector(`#calc-form [data-f="${f.k}"] label span`);if(sp)sp.textContent=tr(f.label(a.inputs))}
  const activeOk=!Object.keys(ae).length;
  const v3=S.view3d!==false,cut=S.view2d==='section';
  const flat=S.type==='slab'||isFoot(S.type);
  const n2d=flat?[L('مسقط','Plan'),L('قطاع','Section')]:[L('مقطع عرضي','Cross'),L('قطاع طولي','Long section')];
  const title2d=cut?(flat?L('قطاع رأسي','Vertical section'):L('قطاع طولي','Longitudinal section')):(flat?L('مسقط أفقي للتسليح','Reinforcement plan'):L('مقطع عرضي','Cross-section'));
  const drawing=ELEMENTS[S.type].fin?'':ELEMENTS[S.type].earth?`<div class="drawing"><div class="drawing-head"><span>${L('قطاع في الحفر','Excavation section')} · ${esc(a.name)}</span><span>${L('مقياس تقريبي','Approximate scale')}</span></div>
      <div class="drawing-body">${activeOk?drawEarth(a.inputs):`<p class="muted" style="padding:3rem 1rem;font-size:var(--t-sm)">${L('صحّح الحقول المظللة لعرض الرسم.','Fix the highlighted fields to show the drawing.')}</p>`}</div></div>`
    :conc?'':`<div class="drawing"><div class="drawing-head"><span>${v3?L('نموذج ثلاثي الأبعاد','3D model'):title2d} · ${esc(a.name)}</span>
      <span style="display:inline-flex;gap:.4rem;flex-wrap:wrap">
      ${v3?'':`<span class="view-toggle" role="group" aria-label="${L('نوع الرسم','Drawing type')}"><button type="button" data-act="v2d" data-v="plan" aria-pressed="${!cut}">${n2d[0]}</button><button type="button" data-act="v2d" data-v="section" aria-pressed="${cut}">${n2d[1]}</button></span>`}

    box.innerHTML=drawing+`<div class="boq calc-sheet" aria-live="polite">

function calcSummary(type,M,mode){
  const el=ELEMENTS[type],n=elName(type),part=concPart();
  if(el.fin)return[n,...M.parts.map(p=>`  ${p.name}: ${f2(p.area)} ${L('م²','m²')}`),`${L('الإجمالي','Total')}: ${f2(M.area)} ${L('م²','m²')}`,
    ...M.mat.map(m=>`${tr(m.label)}: ${fmtF(m.v,m.d)} ${tr(m.unit)}`)].join('\n');
  if(el.earth){const fv=earthView()==='fill';
    return[tr(EARTH_VIEW[earthView()].name),...M.parts.map(p=>`  ${p.name}: ${f3(fv?p.fill:p.exc)} ${M3()}`),
      `${L('الإجمالي','Total')}: ${f3(fv?M.fill:M.exc)} ${M3()}`+(fv?` · ${L('زائد للنقل','surplus to haul')} ${f3(M.surplus)} ${M3()}`:'')].join('\n')}
  if(mode==='conc'&&part==='plain')return[`${L('حساب الخرسانة العادية (نظافة)','Plain concrete (blinding)')} — ${n}`,
    ...M.parts.map(p=>{const d=el.plainDims(numObj(p.inputs));return d?`  ${p.name}: ${d.n} × ${f2(d.L)} × ${f2(d.W)} × ${f2(d.H)} = ${f3(p.plain)} ${M3()}`:null}).filter(Boolean),
    `${L('الإجمالي','Total')}: ${f3(M.plain)} ${M3()}`].join('\n');
  if(mode==='conc'&&part==='rc')return[`${L('حساب الخرسانة المسلحة','Reinforced concrete')} — ${n}`,
    ...M.parts.map(p=>{const d=el.dims(numObj(p.inputs));return`  ${p.name}: ${d.n} × ${f2(d.L)} × ${f2(d.W)} × ${f2(d.H)} = ${f3(p.conc)} ${M3()}`}),
    `${L('الإجمالي','Total')}: ${f3(M.conc)} ${M3()}`].join('\n');
  if(mode==='conc')return[`${L('حساب الخرسانة','Concrete calculation')} — ${n}`,
    ...M.parts.map(p=>{const d=el.dims(numObj(p.inputs));return`  ${p.name}: ${d.n} × ${d.area?f2(d.L)+' '+L('م²','m²'):f2(d.L)+' × '+f2(d.W)} × ${f2(d.H)} = ${f3(p.conc)} ${M3()}${p.plain?` (+${f3(p.plain)} ${L('نظافة','blinding')})`:''}`}),
    `${L('الإجمالي','Total')}: ${f3(M.conc)} ${M3()} ${L('خرسانة مسلحة','reinforced concrete')}${M.plain?` + ${f3(M.plain)} ${M3()} ${L('عادية','plain')}`:''}`].join('\n');
  return[`${L('حساب الحديد','Rebar calculation')} — ${n}`,
    ...M.parts.flatMap(p=>p.bars.map(b=>`  ${p.name} ${b.role} Ø${b.d}: ${fmt(b.count,0)} × ${f2(b.len)} m = ${fmtF(b.kg,1)} kg`)),
    `${L('الإجمالي','Total')}: ${fmtF(M.steel,1)} kg (${f3(M.steel/1000)} t)`,
    ...M.dias.map(d=>`  Ø${d.d}: ${d.bars12} × 12 m`)].join('\n');
}

/* ================== final report ================== */
function dedBad(raw,gross){if(raw===''||raw==null)return false;const n=+raw;return isNaN(n)||n<0||n>gross}
function reportData(p){
  const ded=p.ded||{};
  const secs=SECTIONS.map(s=>({...s,title:tr(s.title),short:tr(s.short),rows:[]}));const sec=k=>secs.find(s=>s.key===k);
  const steel=[];
  for(const it of p.items){
    const el=ELEMENTS[it.type],multi=it.types.length>1;
    it.types.forEach((t,i)=>{
      const label=multi?`${t.name} — ${it.label}`:`${it.label}`;
      const v=numObj(t.inputs);
      const add=(s,key,lbl,d)=>{const r=rowOf(lbl,d);const raw=ded[key]??(i===0&&!key.endsWith('-p')?ded[it.id]:undefined);
        r.raw=raw??'';r.bad=dedBad(raw,r.gross);r.ded=r.bad?0:(+raw||0);r.net=r.gross-r.ded;r.key=key;s.rows.push(r)};
      if(el.fin){
        // finishes: openings are the deduction (fixed); materials are collected per section
        const c=el.calc(v),s=sec(it.type);s.rows.push({label,...c.fin,fixed:true});
        s.mat=s.mat||[];for(const m of c.mat){const o=s.mat.find(x=>x.key===m.key);if(o)o.v+=m.v;else s.mat.push({...m})}
        return;
      }
      if(el.earth){
        // excavation: deductible like concrete; backfill: its deduction is the buried volume, not typed in
        const g=earthGeom(v),base={label,n:g.dims.n,L:g.a,W:g.b,H:g.dims.H},key=`${it.id}:${i}-e`,raw=ded[key];
        const r={...base,gross:g.exc,raw:raw??'',bad:dedBad(raw,g.exc),key};r.ded=r.bad?0:(+raw||0);r.net=r.gross-r.ded;sec('exc').rows.push(r);
        sec('fill').rows.push({...base,gross:g.exc,ded:g.buried,net:g.fill,fixed:true});
        return;
      }
      add(sec(it.type),`${it.id}:${i}`,label,el.dims(v));
      sec(it.type).rows[sec(it.type).rows.length-1].kind=kindOf(v);
      if(el.plainDims){const pd=el.plainDims(v);if(pd)add(sec('plain'),`${it.id}:${i}-p`,label,pd)}
      for(const b of compute(it.type,t.inputs).bars)steel.push({label,role:b.role,st:b.st,d:b.d,count:b.count,len:b.len,kg:b.kg});
    });
  }
  const by={};for(const b of steel){const o=by[b.d]||(by[b.d]={d:b.d,len:0,kg:0});o.len+=b.count*b.len;o.kg+=b.kg}
  const dias=Object.values(by).sort((a,b)=>a.d-b.d).map(o=>({...o,bars12:Math.ceil(o.len/BAR_LEN)}));
  return{secs:secs.filter(s=>s.rows.length),steel,dias};
}
const CONC_SUM=()=>L('ملخص كميات الخرسانة','Concrete quantities summary');
const repTitle=mode=>mode==='steel'?L('حصر حديد التسليح','Rebar take-off'):L('حصر الخرسانة','Concrete take-off');

function reportBody(p,editable,mode){
  const D=reportData(p);
  if(!D.secs.length)return'';
  if(mode==='steel'){
    return steelSplit(D.steel,L('جميع العناصر الخرسانية','all concrete elements')).map(t=>steelTableHTML(t.title,t.rows)).join('')
      +`<p class="rep-note">${L('أطوال الحديد تشمل الأشاير والقنشات ووصلات التراكب والتثبيت حسب المدخل لكل بند.','Bar lengths include starters, bends, laps and anchorage as entered for each item.')}</p>`;
  }
  const tables=D.secs.map(s=>{
    if(editable)s.rows.filter(r=>!r.fixed).forEach(r=>r.dedCell=`<input class="ded${r.bad?' bad':''}" id="ded-${r.key}" data-ded="${r.key}" inputmode="decimal" value="${esc(r.raw)}" placeholder="—" aria-label="${H.ded()} ${esc(r.label)}" title="${r.bad?L('الخصم يجب أن يكون بين 0 و ','Deduction must be between 0 and ')+f3(r.gross):L('خصم بالمتر المكعب (تقاطعات، فتحات)','Deduction in m³ (intersections, openings)')}">`);
    if(s.fin)return finTableHTML(s.title,s.rows,ELEMENTS[s.key].wLab)+matHTML(s.mat||[]);
    return concTableHTML(s.title,s.key==='footing'?footOrder(s.rows):s.rows)}).join('');
  const cs=D.secs.filter(s=>!s.earth&&!s.fin),total=sum(cs,s=>sum(s.rows,'net'));
  if(!cs.length)return tables;
  return tables+`<section class="rep-sec"><h3>${CONC_SUM()}</h3>
    <div class="tbl-wrap"><table class="boq-t">
      <thead><tr><th style="width:55%">${H.desc()}</th><th>${H.unit()}</th><th>${L('الكمية','Quantity')}</th></tr></thead>
      <tbody>${cs.map(s=>`<tr><td class="desc">${s.short}</td><td class="desc">${M3()}</td><td class="tot">${f3(sum(s.rows,'net'))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="lbl" colspan="2">${L('إجمالي الخرسانة','Total concrete')}</td><td>${f3(total)}</td></tr></tfoot>
    </table></div>
    <p class="rep-note">${L('الأبعاد بالمتر. «إضافة» = العدد × الطول × العرض × الارتفاع، و«إجمالي» = الإضافة − الخصم.','Dimensions in metres. "Add" = count × length × width × height; "Total" = Add − Deduct.')}</p></section>`;
}

/* ================== Excel export (styled like the on-screen sheet) ================== */
let excelP=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(!excelP)excelP=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('no ExcelJS'));
    s.onerror=()=>{excelP=null;rej(new Error('load failed'))};document.head.appendChild(s)});
  return excelP;
}
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// spreadsheet colours follow the site palette (light variant, since sheets print on white)
const argb=h=>'FF'+h.slice(1).toUpperCase();
const XC={get yellow(){return argb(palette().light.head)},get red(){return argb(palette().light.title)},foot:'FFF2F2F2',ink:'FF000000'};
const bThin={style:'thin',color:{argb:XC.ink}},bMed={style:'medium',color:{argb:XC.ink}},bDash={style:'dashed',color:{argb:'FF888888'}};
const colL=n=>String.fromCharCode(64+n);
const FONT='Arial';
const xStart=()=>L('right','left');

function xlSheet(wb,name){
  const ws=wb.addWorksheet(name.replace(/[\\/*?:\[\]]/g,' ').slice(0,31),{views:[{rightToLeft:LANG==='ar',showGridLines:false}],
    pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true}});
  ws.columns=[30,14,10,11,12,12,12,12,12].map(width=>({width}));
  return{ws,r:1};
}
function xlLine(X,text,cols,{size=13,color=XC.red,bold=true}={}){
  X.ws.mergeCells(X.r,1,X.r,cols);const c=X.ws.getCell(X.r,1);
  c.value=text;c.font={name:FONT,bold,size,color:{argb:color}};c.alignment={horizontal:xStart(),vertical:'middle'};
  X.ws.getRow(X.r).height=size+10;X.r++;
}
function xlMeta(X,p,title){
  if(p.contractor)xlLine(X,p.contractor,9,{size:18});
  for(const[lab,k]of META()){
    const a=X.ws.getCell(X.r,1);a.value=lab;a.font={name:FONT,bold:true,size:11};a.alignment={horizontal:xStart()};
    X.ws.mergeCells(X.r,2,X.r,5);const b=X.ws.getCell(X.r,2);b.value=k==='reportDate'?(p[k]||today()):(p[k]||'..........');b.font={name:FONT,size:11};b.alignment={horizontal:xStart()};X.r++;
  }
  X.r++;xlLine(X,title,9,{size:15,color:XC.ink});X.r++;
}
// top: [{t,c,c2?,rs?}] — rs:2 spans both header rows; sub: [{t,c}] or null for a single header row
function xlHead(X,cols,top,sub){
  const ws=X.ws,r1=X.r,r2=sub?X.r+1:X.r;
  for(const h of top){
    if(h.rs===2&&sub)ws.mergeCells(r1,h.c,r2,h.c);else if(h.c2)ws.mergeCells(r1,h.c,r1,h.c2);
    ws.getCell(r1,h.c).value=h.t;
  }
  if(sub)for(const h of sub)ws.getCell(r2,h.c).value=h.t;
  for(let r=r1;r<=r2;r++){ws.getRow(r).height=24;
    for(let c=1;c<=cols;c++){const cell=ws.getCell(r,c);
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.yellow}};
      cell.font={name:FONT,bold:true,size:11};cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
      cell.border={top:r===r1?bMed:bThin,bottom:bThin,left:bThin,right:bThin}}}
  X.r=r2+1;
}
function xlRow(X,vals,fmts,boldCols=[]){
  const ws=X.ws;
  vals.forEach((v,j)=>{const c=ws.getCell(X.r,j+1);c.value=v;
    if(fmts[j]&&fmts[j]!=='@')c.numFmt=fmts[j];
    c.font={name:FONT,size:11,bold:boldCols.includes(j+1)};c.alignment={horizontal:'center',vertical:'middle'};
    c.border={left:bThin,right:bThin,bottom:bDash}});
  ws.getRow(X.r).height=20;X.r++;
}
function xlFoot(X,cols,label,mergeTo,vals,fmt){
  const ws=X.ws;if(mergeTo>1)ws.mergeCells(X.r,1,X.r,mergeTo);
  ws.getCell(X.r,1).value=label;
  vals.forEach((v,j)=>{ws.getCell(X.r,mergeTo+1+j).value=v});
  for(let c=1;c<=cols;c++){const cell=ws.getCell(X.r,c);
    if(c>mergeTo)cell.numFmt=Array.isArray(fmt)?fmt[c-mergeTo-1]:fmt;
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.foot}};
    cell.font={name:FONT,bold:true,size:11};cell.alignment={horizontal:c<=mergeTo?xStart():'center',vertical:'middle'};
    cell.border={top:bMed,bottom:bMed,left:bThin,right:bThin}}
  ws.getRow(X.r).height=22;X.r+=2;
}
const xSum=(c,a,b,result)=>({formula:`SUM(${colL(c)}${a}:${colL(c)}${b})`,result});

function xlConc(X,title,rows){
  xlLine(X,ITEM()+title,9);
  xlHead(X,9,[{t:H.desc(),c:1,rs:2},{t:H.unit(),c:2,rs:2},{t:H.count(),c:3,rs:2},{t:H.dims(),c:4,c2:6},{t:H.qty(),c:7,c2:9}],
    [{t:H.len(),c:4},{t:H.wid(),c:5},{t:H.hgt(),c:6},{t:H.ded(),c:7},{t:H.add(),c:8},{t:H.tot(),c:9}]);
  const a=X.r;
  for(const x of rows){const i=X.r;
    xlRow(X,[x.label,M3(),x.n,x.L,x.area?null:x.W,x.H,x.ded||null,{formula:x.area?`C${i}*D${i}*F${i}`:`C${i}*D${i}*E${i}*F${i}`,result:x.gross},{formula:`H${i}-G${i}`,result:x.net}],
      ['@','@','0',x.area?`0.00" ${L('م²','m²')}"`:'0.00','0.00','0.00','0.000','0.000','0.000'],[9]);
    // area entry: one merged cell across length and width
    if(x.area)X.ws.mergeCells(i,4,i,5);
  }
  const b=X.r-1;
  xlFoot(X,9,H.itemTot(),6,[xSum(7,a,b,sum(rows,'ded')),xSum(8,a,b,sum(rows,'gross')),xSum(9,a,b,sum(rows,'net'))],'0.000');
}
function xlFin(X,title,rows,wLab){
  xlLine(X,ITEM()+title,9);
  xlHead(X,9,[{t:H.desc(),c:1,rs:2},{t:H.unit(),c:2,rs:2},{t:H.count(),c:3,rs:2},{t:H.dims(),c:4,c2:5},{t:L('عدد الأوجه','Faces'),c:6,rs:2},{t:H.qty(),c:7,c2:9}],
    [{t:H.len(),c:4},{t:tr(wLab),c:5},{t:H.ded(),c:7},{t:H.add(),c:8},{t:H.tot(),c:9}]);
  const a=X.r;
  for(const x of rows){const i=X.r;
    // add = count × length × width/height × faces; total = add − openings
    xlRow(X,[x.note?`${x.label} (${x.note})`:x.label,L('م²','m²'),x.n,x.L,x.W,x.sd,x.ded||null,{formula:`C${i}*D${i}*E${i}*F${i}`,result:x.gross},{formula:`H${i}-G${i}`,result:x.net}],
      ['@','@','0','0.00','0.00','0','0.00','0.00','0.00'],[9]);
  }
  const b=X.r-1;
  xlFoot(X,9,H.itemTot(),6,[xSum(7,a,b,sum(rows,'ded')),xSum(8,a,b,sum(rows,'gross')),xSum(9,a,b,sum(rows,'net'))],'0.00');
}
function xlMat(X,mat){
  if(!mat.length)return;
  xlHead(X,3,[{t:L('المواد','Materials'),c:1},{t:H.unit(),c:2},{t:L('الكمية','Quantity'),c:3}],null);
  for(const m of mat)xlRow(X,[tr(m.label),tr(m.unit),m.v],['@','@',m.d?'0.'+'0'.repeat(m.d):'0'],[3]);
  X.r++;
}
function xlSteel(X,title,rows){
  xlLine(X,ITEM()+title,7);
  xlHead(X,7,[{t:H.desc(),c:1,rs:2},{t:H.dia(),c:2,rs:2},{t:H.count(),c:3,rs:2},{t:H.barLen(),c:4,rs:2},{t:H.totLen(),c:5,rs:2},{t:H.qty(),c:6,c2:7}],
    [{t:H.kg(),c:6},{t:H.ton(),c:7}]);
  const a=X.r;
  for(const x of rows){const i=X.r;
    // total length = count × bar length; weight = total length × Ø²/162 (kg per metre)
    xlRow(X,[steelDesc(x),x.d,x.count,x.len,{formula:`C${i}*D${i}`,result:x.count*x.len},{formula:`E${i}*B${i}*B${i}/162`,result:x.kg},{formula:`F${i}/1000`,result:x.kg/1000}],
      ['@','0','0','0.00','0.00','0.0','0.000'],[7]);
  }
  const b=X.r-1,kg=sum(rows,'kg');
  xlFoot(X,7,H.itemTot(),4,[xSum(5,a,b,sum(rows,r=>r.count*r.len)),xSum(6,a,b,kg),xSum(7,a,b,kg/1000)],['0.00','0.0','0.000']);
}
function xlConcSummary(X,secs){
  xlLine(X,CONC_SUM(),3);
  xlHead(X,3,[{t:H.desc(),c:1},{t:H.unit(),c:2},{t:L('الكمية','Quantity'),c:3}],null);
  const a=X.r;
  for(const s of secs)xlRow(X,[s.short,M3(),sum(s.rows,'net')],['@','@','0.000'],[3]);
  xlFoot(X,3,L('إجمالي الخرسانة','Total concrete'),2,[xSum(3,a,X.r-1,sum(secs,s=>sum(s.rows,'net')))],'0.000');
}
async function saveWorkbook(build,filename){
  toast(L('جارٍ تجهيز ملف Excel…','Preparing the Excel file…'));
  let ExcelJS;
  try{ExcelJS=await loadExcel()}catch(e){toast(L('تعذّر تحميل أداة Excel. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.','Could not load the Excel tool. Check your internet connection and try again.'));return}
  try{
    const wb=new ExcelJS.Workbook();wb.creator='ConcreteCalc';wb.created=new Date();
    build(wb);
    const buf=await wb.xlsx.writeBuffer();
    await offerFile(filename,new Blob([buf],{type:XLSX_MIME}));
  }catch(e){toast(L('تعذّر إنشاء ملف Excel.','Could not create the Excel file.'))}
}
function reportXlsx(p,mode){
  const D=reportData(p),steel=mode==='steel';
  saveWorkbook(wb=>{
    const X=xlSheet(wb,repTitle(mode));
    xlMeta(X,p,repTitle(mode));
    if(steel){for(const t of steelSplit(D.steel,L('جميع العناصر الخرسانية','all concrete elements')))xlSteel(X,t.title,t.rows)}
    else{for(const s of D.secs){if(s.fin){xlFin(X,s.title,s.rows,ELEMENTS[s.key].wLab);xlMat(X,s.mat||[])}else xlConc(X,s.title,s.key==='footing'?footOrder(s.rows):s.rows)}
      const cs=D.secs.filter(s=>!s.earth&&!s.fin);if(cs.length)xlConcSummary(X,cs)}
  },fileSafe(p.name)+(steel?L('-حصر-حديد','-rebar-takeoff'):L('-حصر-خرسانة','-concrete-takeoff'))+'.xlsx');
}
function calcXlsx(){
  const M=S.last,el=ELEMENTS[S.type],conc=S.mode==='conc',n=elName(S.type);if(!M)return;
  if(el.fin){
    saveWorkbook(wb=>{const X=xlSheet(wb,n);
      xlLine(X,L('حساب التشطيبات — ','Finishes — ')+n,9,{size:15,color:XC.ink});xlLine(X,L('التاريخ : ','Date: ')+today(),9,{size:11,color:XC.ink,bold:false});X.r++;
      xlFin(X,L('بالمتر المربع ','Per m²: ')+n,finRows(M),el.wLab);xlMat(X,M.mat);
    },L('تشطيبات-','finishes-')+fileSafe(n)+'-'+today()+'.xlsx');
    return;
  }
  if(el.earth){
    saveWorkbook(wb=>{const X=xlSheet(wb,n);
      xlLine(X,n,9,{size:15,color:XC.ink});xlLine(X,L('التاريخ : ','Date: ')+today(),9,{size:11,color:XC.ink,bold:false});X.r++;
      const R_=earthRows(M);
      if(earthView()==='fill'){xlConc(X,secTitle('fill'),R_.fill);
        xlLine(X,L(`الأتربة الزائدة للنقل (منفوشة): ${f3(M.surplus)} م³`,`Surplus soil to haul (bulked): ${f3(M.surplus)} m³`),9,{size:12,color:XC.ink})}
      else xlConc(X,secTitle('exc'),R_.exc);
    },(earthView()==='fill'?L('ردم-','backfill-'):L('حفر-','excavation-'))+today()+'.xlsx');
    return;
  }
  saveWorkbook(wb=>{
    const X=xlSheet(wb,(conc?L('خرسانة ','Concrete '):L('حديد ','Rebar '))+n);
    xlLine(X,(conc?L('حساب الخرسانة — ','Concrete calculation — '):L('حساب الحديد — ','Rebar calculation — '))+n,9,{size:15,color:XC.ink});
    xlLine(X,L('التاريخ : ','Date: ')+today(),9,{size:11,color:XC.ink,bold:false});X.r++;
    if(conc){
      const rc=M.parts.map(p=>({...rowOf(p.name,el.dims(numObj(p.inputs))),kind:kindOf(p.inputs)}));
      const pr=el.plainDims?M.parts.map(p=>{const d=el.plainDims(numObj(p.inputs));return d&&rowOf(p.name,d)}).filter(Boolean):[];
      const part=concPart();
      if(pr.length&&part!=='rc')xlConc(X,secTitle('plain'),pr);
      if(part!=='plain')xlConc(X,secTitle(S.type),S.type==='footing'?footOrder(rc):rc);
    }else{
      for(const t of steelSplit(M.parts.flatMap(p=>p.bars.map(b=>({label:p.name,role:b.role,st:b.st,d:b.d,count:b.count,len:b.len,kg:b.kg}))),n))xlSteel(X,t.title,t.rows);
    }
  },(conc?(concPart()==='plain'?L('خرسانة-عادية-','plain-concrete-'):concPart()==='rc'?L('خرسانة-مسلحة-','rc-concrete-'):L('خرسانة-','concrete-')):L('حديد-','rebar-'))+fileSafe(n)+'-'+today()+'.xlsx');
}

/* ================== modals ================== */
function modal(html){closeModal();const o=document.createElement('div');o.className='overlay';o.dir=L('rtl','ltr');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});document.body.appendChild(o);S.modal=o;const f=o.querySelector('input,select');f&&f.focus()}
function closeModal(){if(S.modal){S.modal.remove();S.modal=null}}
const cancelBtn=()=>`<button class="btn ghost" type="button" data-act="close">${L('إلغاء','Cancel')}</button>`;

function saveModal(presetProject){
  const P=S.data.projects;
  const def=presetProject&&P.some(p=>p.id===presetProject)?presetProject:(P[0]&&P[0].id)||'__new';
  const n=elName(S.type),cnt=E().list.length;
  const names=E().list.map(t=>esc(t.name)).join(listSep());
  modal(`<h3>${L(`حفظ ${n} في مشروع`,`Save ${n.toLowerCase()} to a project`)}</h3>
    <p class="muted" style="font-size:var(--t-sm)">${L(`سيُحفظ ${cnt} ${cnt>1?'أنواع':'نوع'}: ${names}، بالخرسانة والحديد معًا.`,`${cnt} ${cnt>1?'types':'type'} will be saved: ${names}, with both concrete and rebar.`)}</p>
    <form id="save-form" class="stack" novalidate>
      <div class="field" data-f="label"><label for="save-label">${L('اسم البند','Item name')}</label><input class="input" id="save-label" value="" placeholder="${L(`مثال: ${n} الدور الأرضي`,`e.g. Ground floor ${n.toLowerCase()}`)}"><div class="msg"></div></div>
      <div class="field"><label for="save-project">${L('المشروع','Project')}</label><select class="input" id="save-project">
        ${P.map(p=>`<option value="${p.id}" ${p.id===def?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="__new" ${def==='__new'?'selected':''}>${L('+ مشروع جديد…','+ New project…')}</option></select></div>
      <div class="field" data-f="newname" id="newname-wrap" ${def==='__new'?'':'hidden'}><label for="save-newname">${L('اسم المشروع الجديد','New project name')}</label><input class="input" id="save-newname" placeholder="${L('فيلا حي النرجس','Al Narjis villa')}"><div class="msg"></div></div>
      <div class="modal-actions"><button class="btn primary" type="submit">${I.save}${L('حفظ','Save')}</button>${cancelBtn()}</div>
    </form>`);
  $('#save-project').onchange=e=>{$('#newname-wrap').hidden=e.target.value!=='__new'};
  $('#save-form').onsubmit=e=>{e.preventDefault();
    const label=$('#save-label').value.trim(),pid=$('#save-project').value,nn=$('#save-newname').value.trim();
    let ok=true;
    const setE=(f,m)=>{const x=document.querySelector(`#save-form [data-f="${f}"]`);x.classList.toggle('err',!!m);x.querySelector('.msg').textContent=m;if(m)ok=false};
    setE('label',label.length<2?L('أدخل اسمًا يميّز البند، مثل الدور أو المرحلة.','Enter a name that identifies the item, such as the floor or phase.'):label.length>80?L('الاسم أطول من 80 حرفًا.','The name is longer than 80 characters.'):'');
    if(pid==='__new')setE('newname',nn.length<2?L('أدخل اسم المشروع.','Enter the project name.'):P.some(p=>p.name===nn)?L('يوجد مشروع بهذا الاسم.','A project with this name already exists.'):'');
    if(!ok||!S.last)return;
    let p=P.find(x=>x.id===pid);
    if(pid==='__new'){p={id:uid(),name:nn,location:'',created:today(),items:[]};P.unshift(p)}
    const types=E().list.map(t=>({name:t.name.trim(),inputs:clone(t.inputs)}));
    p.items.push({id:uid(),type:S.type,label,types,r:stripR(computeMulti(S.type,types)),date:today()});
    S.lastProject=p.id;S.open[p.id]=true;save();closeModal();toast(L(`حُفظ «${label}» في ${p.name}.`,`Saved "${label}" to ${p.name}.`));
  };
}

function projModal(){
  modal(`<h3>${L('مشروع جديد','New project')}</h3><form id="proj-form" class="stack" novalidate>
    <div class="field" data-f="pname"><label for="p-name">${L('اسم المشروع','Project name')}</label><input class="input" id="p-name" placeholder="${L('عمارة سكنية — 4 أدوار','Residential building — 4 floors')}"><div class="msg"></div></div>
    <div class="field"><label for="p-loc">${L('الموقع','Location')} <span class="unit">${L('اختياري','optional')}</span></label><input class="input" id="p-loc" placeholder="${L('الرياض، حي الملقا','Riyadh, Al Malqa')}"></div>
    <div class="modal-actions"><button class="btn primary" type="submit">${L('إنشاء المشروع','Create project')}</button>${cancelBtn()}</div></form>`);
  $('#proj-form').onsubmit=e=>{e.preventDefault();const n=$('#p-name').value.trim();const f=$('#proj-form [data-f="pname"]');
    const m=n.length<2?L('أدخل اسم المشروع (حرفان على الأقل).','Enter a project name (at least 2 characters).'):S.data.projects.some(p=>p.name===n)?L('يوجد مشروع بهذا الاسم.','A project with this name already exists.'):'';
    f.classList.toggle('err',!!m);f.querySelector('.msg').textContent=m;if(m)return;
    const p={id:uid(),name:n,location:$('#p-loc').value.trim(),created:today(),items:[]};S.data.projects.unshift(p);S.open[p.id]=true;save();closeModal();render();toast(L('أُنشئ المشروع ','Created project ')+n)};
}
function confirmModal(msg,okLabel,fn){
  modal(`<h3>${msg}</h3><p class="muted">${L('لا يمكن التراجع عن هذه الخطوة.','This cannot be undone.')}</p><div class="modal-actions"><button class="btn primary" id="cm-ok" style="background:var(--bad);border-color:var(--bad)">${okLabel}</button>${cancelBtn()}</div>`);
  $('#cm-ok').onclick=()=>{fn();closeModal();render()};$('#cm-ok').focus();
}

  const mk=(type,label,types)=>{const ts=types.map(([name,inp])=>({name,inputs:clone({...ELEMENTS[type].def,...inp})}));
    return{id:uid(),type,label,types:ts,r:stripR(computeMulti(type,ts)),date:today()}};
  const p=t=>tr(ELEMENTS[t].prefix);
  return{id:uid(),name:L('فيلا سكنية دورين','Two-storey villa'),location:L('مثال توضيحي','Illustrative example'),created:today(),example:true,items:[
    mk('footing',L('القواعد المنفصلة','Isolated footings'),[[p('footing')+'1',{n:9,L:1.8,W:1.6,D:60}],[p('footing')+'2',{n:2,L:2.0,W:1.7,D:60}],[p('footing')+'3',{n:2,L:2.4,W:2.0,D:70,d:18}]]),

const DS_DEF={v:2,brand:'#E3A21A',charcoal:'#1E1C19',

const FONTS={'Alexandria':'Alexandria:wght@500;600;700;800','Cairo':'Cairo:wght@500;600;700;800','Readex Pro':'Readex+Pro:wght@500;600;700',
  'Tajawal':'Tajawal:wght@500;700;800','Reem Kufi':'Reem+Kufi:wght@500;600;700','IBM Plex Sans Arabic':'IBM+Plex+Sans+Arabic:wght@500;600;700'};

const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h);
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=a=>'#'+a.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return hex(A.map((x,i)=>x+(B[i]-x)*t))};
const lum=h=>{const c=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
// shift a colour toward black/white until it reads as text on the given ground
function readable(c,ground,toward){for(let t=0;t<=1;t+=.05){const m=mix(c,toward,t);if(contrast(m,ground)>=4.5)return m}return toward}
function ensureFont(name){
  const id='font-'+name.replace(/\s+/g,'-');if(document.getElementById(id)||!FONTS[name])return;
  const l=document.createElement('link');l.id=id;l.rel='stylesheet';l.href=`https://fonts.googleapis.com/css2?family=${FONTS[name]}&display=swap`;document.head.appendChild(l);
}
const inkOn=c=>contrast(c,'#1B1A17')>=contrast(c,'#FFFFFF')?'#1B1A17':'#FFFFFF';
// the whole colour system, derived from the main colour and the dark neutral
function palette(d=DS){
  const b=d.brand,c=d.charcoal;
  return{
    brand:b,brandInk:inkOn(b),charcoal:c,
    light:{accent:readable(b,'#FFFFFF','#000000'),soft:mix(b,'#FFFFFF',.8),
      head:mix(b,'#FFFFFF',.68),headInk:'#1B1A17',title:readable(mix(b,'#000000',.2),'#FFFFFF','#000000'),
      steel:readable(b,'#FFFFFF','#000000'),steelSoft:mix(b,'#FFFFFF',.84),conc:mix(c,'#FFFFFF',.4),
      charcoal:c,charcoal2:mix(c,'#FFFFFF',.07)},
    dark:{accent:readable(b,'#22211E','#FFFFFF'),soft:mix(b,'#000000',.74),
      head:mix(b,'#000000',.6),headInk:mix(b,'#FFFFFF',.8),title:readable(b,'#22211E','#FFFFFF'),
      steel:readable(mix(b,'#FFFFFF',.15),'#22211E','#FFFFFF'),steelSoft:mix(b,'#000000',.76),conc:mix(c,'#FFFFFF',.62),
      charcoal:mix(c,'#000000',.5),charcoal2:mix(c,'#000000',.1)},

}

function bindAuth(){
  $('#auth-form').onsubmit=async e=>{e.preventDefault();
    const login=S.authTab==='login';
    const g=id=>{const el=$(id);return el?el.value.trim():''};
    const name=g('#a-name'),email=g('#a-email').toLowerCase(),pw=$('#a-pw').value,pw2=$('#a-pw2')?$('#a-pw2').value:'';
    const errs={};
    if(!login&&name.length<2)errs.name=L('أدخل اسمك (حرفان على الأقل).','Enter your name (at least 2 characters).');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))errs.email=L('أدخل بريدًا إلكترونيًا صالحًا مثل name@example.com.','Enter a valid email such as name@example.com.');
    if(!pw)errs.pw=L('أدخل كلمة المرور.','Enter your password.');
    else if(!login&&pw.length<8)errs.pw=L('كلمة المرور 8 أحرف على الأقل.','Use at least 8 characters.');
    else if(!login&&!(/[A-Za-z؀-ۿ]/.test(pw)&&/\d/.test(pw)))errs.pw=L('استخدم أحرفًا وأرقامًا معًا.','Use both letters and numbers.');
    if(!login&&pw!==pw2)errs.pw2=L('كلمتا المرور غير متطابقتين.','The passwords do not match.');
    document.querySelectorAll('#auth-form .field').forEach(f=>{const m=errs[f.dataset.f]||'';f.classList.toggle('err',!!m);f.querySelector('.msg').textContent=m});
    const box=$('#auth-err');box.hidden=true;
    if(Object.keys(errs).length)return;
    const U=users();
    if(login){
      const u=U[email];
      if(!u||await hash(pw,u.salt)!==u.hash){box.textContent=L('البريد أو كلمة المرور غير صحيحة. تحقق منهما أو أنشئ حسابًا جديدًا.','Incorrect email or password. Check them or create a new account.');box.hidden=false;return}
      signIn(email,u);
    }else{
      if(U[email]){box.textContent=L('هذا البريد مسجّل مسبقًا على هذا الجهاز. سجّل الدخول بدلًا من ذلك.','This email is already registered on this device. Sign in instead.');box.hidden=false;return}
      const salt=uid();U[email]={name,salt,hash:await hash(pw,salt),created:today()};store.set('cc.users',U);
      store.set(dataKey(email),{projects:[]});signIn(email,U[email]);toast(L('أُنشئ حسابك. ابدأ بإنشاء مشروع.','Account created. Start by creating a project.'));
    }
  };
}

    signIn(em,U[em]);

  else if(a==='type'){S.type=v;if(b.dataset.view)S.earthView=b.dataset.view;if(ELEMENTS[v].fin)S.finType=v;render()}

  else if(a==='opadd'){const i=cur().inputs;i.ops=opRows(i).slice();i.ops.push(v==='w'?{k:'w',n:1,w:1.2,h:1.2}:{k:'d',n:1,w:.9,h:2.1});render()}
  else if(a==='opdel'){const i=cur().inputs;i.ops=opRows(i).filter((_,j)=>j!==+v);render()}
  else if(a==='finhi'){
    // keep the same wall area: metres × height ↔ one figure that already includes the height
    const i=cur().inputs,k=+v;if((+i.hi===2?2:1)===k)return;
    if(k===2)i.TL=+((+i.TL||0)*(+i.W||0)).toFixed(2)||i.TL;else if(+i.W>0)i.TL=+((+i.TL||0)/(+i.W)).toFixed(2);
    i.hi=k;render()}
  else if(a==='finlm'){
    // switching keeps the total wall length: wall rows ↔ one total of running metres (height = area-weighted average)
    const i=cur().inputs,k=+v;if((byRun(i)?2:1)===k)return;
    const rows=wallRows(i),len=sum(rows,r=>(+r.c||0)*(+r.l||0)),area=sum(rows,wallRowArea);
    if(k===2){if(len){i.TL=+(+i.hi===2?area:len).toFixed(2);if(+i.hi!==2)i.W=+(area/len).toFixed(2)}}
    else if(!Array.isArray(i.walls))i.walls=+i.hi===2?[{c:1,l:+i.TL||0,h:1}]:[{c:1,l:+i.TL||0,h:+i.W||0}];
    i.lm=k;render()}
  else if(a==='walladd'){const i=cur().inputs;i.walls=wallRows(i).map(x=>({...x}));const p=i.walls[i.walls.length-1];i.walls.push({c:1,l:4,h:p?p.h:3});render()}
  else if(a==='walldel'){const i=cur().inputs;i.walls=wallRows(i).filter((_,j)=>j!==+v);render()}
  else if(a==='embm'){cur().inputs.embm=+v;render()}
  else if(a==='earthbv'){cur().inputs.bvm=+v;render()}
  else if(a==='hastie'){S.noTie=v==='2';store.set('cc.notie',S.noTie);render()}
  else if(a==='earthby'){const i=cur().inputs,k=+v;if((+i.by===2?2:1)===k)return;
    // keep the footprint: area from length × width, or a square of the same area back
    if(k===2)i.gA=+((+i.gL||0)*(+i.gW||0)).toFixed(2)||i.gA;else{const sd=Math.sqrt(+i.gA||0);if(!(Math.abs(i.gL*i.gW-i.gA)<.01)){i.gL=+sd.toFixed(2);i.gW=+sd.toFixed(2)}}
    i.by=k;render()}
  else if(a==='earthkind'){const t=cur(),k=+v;if(kindOf(t.inputs)===k)return;const F0=ELEMENTS.earth;t.inputs={...F0.def,...(k===2?F0.def2:{}),dep:t.inputs.dep,sw:t.inputs.sw};render()}
  else if(a==='slabby'){
    // switching to area fills it from the current length × width (and back), so the volume stays the same
    const t=cur(),k=+v;if((byArea(t.inputs)?2:1)===k)return;
    const i=t.inputs;
    if(k===2){const A=(+i.Lx||0)*(+i.Ly||0);i.A=A>0?+A.toFixed(2):(i.A||108)}
    else{const s=Math.sqrt(+i.A||0);if(!(+i.Lx>0&&+i.Ly>0&&Math.abs(i.Lx*i.Ly-i.A)<.01)){i.Lx=+s.toFixed(2);i.Ly=+s.toFixed(2)}}
    i.by=k;render()}
  else if(a==='footkind'){
    // switching a type's kind loads that kind's starting sizes; a default-style name follows the kind (ق1 ↔ قم1)
    const t=cur(),k=+v;if(kindOf(t.inputs)===k)return;
    const F0=ELEMENTS.footing;t.inputs={...F0.def,...(k===2?F0.def2:{})};
    const oldPre=tr(KIND_PREFIX[k===2?1:2]);if(new RegExp('^'+oldPre+'\\d+$').test(t.name))t.name=nextName(E().list.filter(x=>x!==t),k);
    render();toast(k===2?L(`${t.name} الآن قاعدة مشتركة.`,`${t.name} is now a combined footing.`):L(`${t.name} الآن قاعدة منفصلة.`,`${t.name} is now an isolated footing.`))}
  else if(a==='mode'){
    // finishes have their own tabs; remember the structural tab to come back to it
    const wasFin=!!ELEMENTS[S.type].fin;S.mode=v;
    if(v==='fin'&&!wasFin){S.lastStruct=S.type;S.type=S.finType||'block'}
    else if(v!=='fin'&&wasFin)S.type=S.lastStruct||'column';
    render()}
  else if(a==='seltype'){E().active=v;render()}
  else if(a==='addtype'){const e2=E(),src=cur(),id=uid();e2.list.push({id,name:nextName(e2.list,isFoot(S.type)?kindOf(src.inputs):0),inputs:clone(src.inputs)});e2.active=id;render();
    const n=$('#f-name');if(n){n.focus();n.select()}toast(L(`أُضيف نوع جديد بنفس مقاسات ${src.name}. عدّل أبعاده.`,`New type added with the same sizes as ${src.name}. Edit its dimensions.`))}
  else if(a==='deltype'){const e2=E();if(e2.list.length<2)return;const t=e2.list.find(x=>x.id===v);e2.list=e2.list.filter(x=>x.id!==v);
    if(e2.active===v)e2.active=e2.list[0].id;render();toast(L('حُذف النوع ','Removed type ')+(t?t.name:''))}
  else if(a==='reset'){S.vals[S.type]=freshEl(S.type);render();toast(L('بدأت قائمة أنواع جديدة بالقيم الافتراضية.','Started a new type list with default values.'))}
  else if(a==='toggle'){S.open[v]=!S.open[v];render()}
  else if(a==='newproj')projModal();
  else if(a==='seed'){S.data.projects.unshift(exampleProject());save();render();toast(L('أُضيف مشروع نموذجي معلَّم «مثال».','Added a sample project marked "Example".'))}
  else if(a==='addto'){S.lastProject=v;S.view='calc';render();scrollTo(0,0)}
  else if(a==='delproj'){const p=proj(v);confirmModal(L(`حذف المشروع «${esc(p.name)}» وكل بنوده؟`,`Delete project "${esc(p.name)}" and all its items?`),L('حذف المشروع','Delete project'),()=>{S.data.projects=S.data.projects.filter(x=>x.id!==v);save();toast(L('حُذف المشروع.','Project deleted.'))})}
  else if(a==='delitem'){const p=proj(b.dataset.p);const it=p.items.find(x=>x.id===v);confirmModal(L(`حذف البند «${esc(it.label)}»؟`,`Delete item "${esc(it.label)}"?`),L('حذف البند','Delete item'),()=>{p.items=p.items.filter(x=>x.id!==v);save();toast(L('حُذف البند.','Item deleted.'))})}
  else if(a==='openitem'){const p=proj(b.dataset.p);const it=p.items.find(x=>x.id===v);
    const list=it.types.map(t=>({id:uid(),name:t.name,inputs:clone({...ELEMENTS[it.type].def,...t.inputs})}));
    S.type=it.type;S.vals[it.type]={list,active:list[0].id};S.lastProject=p.id;S.view='calc';render();scrollTo(0,0);
    toast(L(`فُتح «${it.label}» للتعديل. احفظه كبند جديد بعد التعديل.`,`Opened "${it.label}" for editing. Save it as a new item when done.`))}
  else if(a==='copyproj'){const p=proj(v);const t=projTotals(p);
    copyText([`${L('مشروع','Project')}: ${p.name}`,...p.items.map(it=>`- ${it.label} (${it.types.map(x=>x.name).join(listSep())}): ${f2(it.r.conc)} ${M3()} / ${fmt(it.r.steel,0)} kg`),
      `${L('الإجمالي','Total')}: ${f2(t.conc)} ${M3()} ${L('خرسانة مسلحة','reinforced concrete')}, ${fmt(t.steel,0)} kg ${L('حديد','steel')}`].join('\n'))}
  else if(a==='backup'){offerFile('concretecalc-backup-'+today()+'.json',JSON.stringify({user:S.user.email,exported:new Date().toISOString(),...S.data},null,2))}
  else if(a==='report'){S.reportId=v;S.view='report';render();scrollTo(0,0)}
  else if(a==='repmode'){S.repMode=v;render()}
  else if(a==='repxlsx')reportXlsx(proj(S.reportId),S.repMode);
  else if(a==='rephtml'){const p=proj(S.reportId);offerFile(fileSafe(p.name)+(S.repMode==='steel'?L('-حصر-حديد','-rebar-takeoff'):L('-حصر-خرسانة','-concrete-takeoff'))+'.html',reportHTMLFile(p,S.repMode))}
  else if(a==='savecalc'){if(!S.last)return;
    // a saved item feeds both reports, so the other calculation's fields must be valid for every type too
    if(ELEMENTS[S.type].fin){saveModal(S.lastProject);return}
    if(ELEMENTS[S.type].earth){
      // excavation and backfill share the types: check both views and open the one with the problem
      const bad=E().list.find(t=>Object.keys(validate(S.type,t.inputs)).length);
      if(bad){const ks=Object.keys(validate(S.type,bad.inputs));S.earthView=ks.some(k=>EARTH_VIEW.fill.keys.includes(k))?'fill':'exc';E().active=bad.id;render();
        toast(L(`بيانات ${bad.name} غير صحيحة. صحّحها ثم احفظ.`,`The data for ${bad.name} is invalid. Fix it, then save.`));return}
      saveModal(S.lastProject);return;
    }
    const other=S.mode==='conc'?'steel':'conc';
    const bad=E().list.find(t=>Object.keys(validate(S.type,t.inputs,other)).length);
    if(bad){S.mode=other;E().active=bad.id;render();toast(other==='steel'?L(`بيانات التسليح في ${bad.name} غير صحيحة. صحّحها ثم احفظ.`,`The rebar data for ${bad.name} is invalid. Fix it, then save.`):L(`الأبعاد في ${bad.name} غير صحيحة. صحّحها ثم احفظ.`,`The dimensions for ${bad.name} are invalid. Fix them, then save.`));return}
    // the footing concrete view shows only one part; the other part's fields must be valid too
    if(concPart()){const other2=concPart()==='plain'?'rc':'plain';
      const bad2=E().list.find(t=>Object.keys(validate(S.type,t.inputs,'conc',other2)).length);
      if(bad2){S.concPart=other2;E().active=bad2.id;render();toast(L(`بيانات ${other2==='rc'?'الخرسانة المسلحة':'خرسانة النظافة'} في ${bad2.name} غير صحيحة. صحّحها ثم احفظ.`,`The ${other2==='rc'?'reinforced concrete':'blinding'} data for ${bad2.name} is invalid. Fix it, then save.`));return}}
    saveModal(S.lastProject)}
  else if(a==='copycalc'){if(S.last)copyText(calcSummary(S.type,S.last,S.mode))}
  else if(a==='xlsxcalc')calcXlsx();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="close"]');if(b&&S.modal&&S.modal.contains(b))closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal)closeModal();else if(!dz.hidden)closeDesigner()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.proj-head')){e.preventDefault();e.target.click()}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.op){
    // one cell of a door/window row: update it, its area and the total, then the results
    const[ix,key]=t.dataset.op.split(':'),i=cur().inputs;if(!Array.isArray(i.ops))i.ops=opRows(i).map(x=>({...x}));
    const r=i.ops[+ix];if(!r)return;
    r[key]=key==='k'?t.value:t.value;
    if(key!=='k'){const ok=t.value!==''&&!isNaN(+t.value)&&+t.value>=0;t.classList.toggle('bad-in',!ok)}
    const ra=document.getElementById('op-a-'+ix);if(ra)ra.textContent=fmtF(opRowArea(r),2)+' m²';
    const tt=document.getElementById('op-total');if(tt)tt.textContent=fmtF(opArea(i),2)+' m²';
    renderResults();return;
  }
  if(t.dataset.wall){
    // one cell of a wall row: update it, its area and the total, then the results
    const[ix,key]=t.dataset.wall.split(':'),i=cur().inputs;if(!Array.isArray(i.walls))i.walls=wallRows(i).map(x=>({...x}));
    const r=i.walls[+ix];if(!r)return;r[key]=t.value;
    t.classList.toggle('bad-in',!(t.value!==''&&!isNaN(+t.value)&&+t.value>=0));
    const ra=document.getElementById('wl-a-'+ix);if(ra)ra.textContent=fmtF(wallRowArea(r),2)+' m²';
    const tt=document.getElementById('wl-total');if(tt)tt.textContent=fmtF(sum(i.walls,wallRowArea),2)+' m²';
    renderResults();return;
  }
  if(t.dataset.k){const i=cur().inputs;
    // the footing mesh count swaps whole sections, so it redraws the form; going to two meshes starts the bottom mesh from the single mesh
    if(t.dataset.k==='layers'&&isFoot(S.type)){if(+t.value===2&&+i.layers!==2){i.dBL=i.dBS=i.d;i.sBL=i.sBS=i.s}i.layers=t.value;render();return}
    i[t.dataset.k]=t.value;renderResults()}
  else if(t.dataset.name){const a=cur();a.name=t.value;const c=document.querySelector(`#chip-${a.id} .chip-name`);if(c)c.textContent=t.value.trim()||'—';renderResults()}
});
app.addEventListener('change',e=>{
  const t=e.target;if(S.view!=='report')return;
  const p=S.data.projects.find(x=>x.id===S.reportId);if(!p)return;
  if(t.dataset.meta){const k=t.dataset.meta,val=t.value.trim();
    if(k==='name'&&val.length<2){t.value=p.name;toast(L('اسم المشروع حرفان على الأقل.','The project name needs at least 2 characters.'));return}
    p[k]=val;save();if(k==='name')render();toast(L('حُفظ التعديل.','Change saved.'))}
  else if(t.dataset.ded){p.ded=p.ded||{};p.ded[t.dataset.ded]=t.value.trim();save();
    const y=scrollY;render();scrollTo(0,y);
    const el=document.getElementById(t.id);if(el&&el.classList.contains('bad'))toast(L('الخصم يجب أن يكون رقمًا بين صفر وكمية الإضافة. لم يُطبَّق.','The deduction must be a number between zero and the added quantity. It was not applied.'))}
});
app.addEventListener('submit',e=>{if(e.target.id==='calc-form')e.preventDefault()});

applyTheme();applyDesign();load();render();
})();
</script>
