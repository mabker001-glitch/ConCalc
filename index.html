<title>ConcreteCalc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: site-office shell. Charcoal nav rail (RTL: right side), working sheet in the middle,
   results styled as a bill-of-quantities slip beside a scaled cross-section; safety-yellow as the one loud colour. */
:root{
  --bg:#EEEDE8;          /* site-office paper, warm grey */
  --surface:#F6F5F1;
  --raised:#FFFFFF;
  --ink:#1B1A17;
  --ink-2:#4A4842;
  --muted:#77746C;
  --line:#D6D3CA;
  --line-2:#E6E3DB;
  --brand:#FFC21A;       /* safety / plant yellow: fills only */
  --brand-ink:#1B1A17;
  --accent:#8A6400;      /* the same yellow darkened enough to read as text on light ground */
  --accent-ink:#1B1A17;
  --accent-soft:#FFF0BF;
  --charcoal:#1E1D1A;    /* rail, hero, footer */
  --charcoal-2:#2B2A26;
  --on-dark:#F2F0EA;
  --on-dark-2:#ADA99F;
  --conc:#5E5B53;        /* concrete quantities in charts */
  --rebar:#94491F;       /* rebar mill-scale brown: used only for steel quantities */
  --rebar-soft:#EFDDD1;
  --grid:#E6E1D2;
  --ok:#2C7549; --ok-soft:#D8EBDF;
  --warn:#8F5E00; --warn-soft:#F4E7C8;
  --bad:#AE2A20; --bad-soft:#F6DAD6;
  --shadow:0 1px 2px rgba(25,32,35,.06),0 6px 20px rgba(25,32,35,.06);
  --boq-head:#F7D917;    /* quantity-survey sheet header yellow */
  --boq-head-ink:#1A1A12;
  --boq-title:#C8331B;

  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;

  --t-xs:.75rem; --t-sm:.8125rem; --t-md:.9375rem; --t-lg:1.125rem; --t-xl:1.5rem; --t-2xl:2rem;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121210; --surface:#1A1917; --raised:#22211E; --ink:#EEECE6; --ink-2:#BDB9AF; --muted:#8C887E;
    --line:#36342F; --line-2:#2A2925; --accent:#FFC94A; --accent-ink:#1B1A17; --accent-soft:#3A3014;
    --charcoal:#0C0C0B; --charcoal-2:#1C1B19; --conc:#B3AEA2;
    --rebar:#E09A6E; --rebar-soft:#3A2619; --grid:#2A2822;
    --ok:#6CC28F; --ok-soft:#173025; --warn:#E3B04F; --warn-soft:#352914; --bad:#F08A80; --bad-soft:#3A1C1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --boq-head:#5C4D0B; --boq-head-ink:#FFF3B0; --boq-title:#F2836B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121210; --surface:#1A1917; --raised:#22211E; --ink:#EEECE6; --ink-2:#BDB9AF; --muted:#8C887E;
  --line:#36342F; --line-2:#2A2925; --accent:#FFC94A; --accent-ink:#1B1A17; --accent-soft:#3A3014;
  --charcoal:#0C0C0B; --charcoal-2:#1C1B19; --conc:#B3AEA2;
  --rebar:#E09A6E; --rebar-soft:#3A2619; --grid:#2A2822;
  --ok:#6CC28F; --ok-soft:#173025; --warn:#E3B04F; --warn-soft:#352914; --bad:#F08A80; --bad-soft:#3A1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --boq-head:#5C4D0B; --boq-head-ink:#FFF3B0; --boq-title:#F2836B;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--t-md);line-height:1.6}
#app{min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:var(--hw,700);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:var(--t-2xl)} h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow{font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);
  padding:.5rem .95rem;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:var(--t-sm);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* forms */
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field label{font-size:var(--t-sm);font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;gap:.5rem}
.field label .unit{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:var(--t-xs)}
.input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .65rem;min-height:2.4rem}
.input.num{text-align:left}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.err .input{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.field .msg{font-size:var(--t-xs);color:var(--bad);min-height:0}
.field .msg:empty{display:none}

/* ---------- AUTH ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);padding-block:0}
.auth-form{display:flex;align-items:center;justify-content:center;padding:2.5rem 1.25rem}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.25rem}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-weight:700;font-size:var(--t-lg)}
.brand-mark{width:30px;height:30px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:1.25rem}
.tab{background:none;border:none;padding:.6rem 0;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:.9rem}
.form-err{background:var(--bad-soft);color:var(--bad);padding:.55rem .75rem;border-radius:var(--r);font-size:var(--t-sm)}
.note{font-size:var(--t-xs);color:var(--muted)}
.divider{display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:var(--t-xs)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.auth-sheet{background:var(--charcoal);color:var(--on-dark);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1.4rem;padding:3.5rem clamp(1.25rem,4vw,3.5rem)}
.auth-sheet::before{content:"";position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(#FFC21A 1px,transparent 1px),linear-gradient(90deg,#FFC21A 1px,transparent 1px);
  background-size:40px 40px}
/* hazard-tape strip along the top edge */
.auth-sheet::after{content:"";position:absolute;inset-inline:0;top:0;height:10px;
  background:repeating-linear-gradient(-45deg,var(--brand) 0 14px,#1B1A17 14px 28px)}
.auth-sheet>*{position:relative}
.auth-sheet .eyebrow{color:var(--brand);letter-spacing:.14em;font-weight:600;text-transform:uppercase}
.auth-sheet h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.12;max-width:16ch;color:#fff;letter-spacing:-.01em}
.auth-sheet .rule{width:min(320px,60%);height:1px;background:rgba(255,255,255,.35)}
.auth-sheet .lede{max-width:46ch;color:var(--on-dark-2)}
.sheet-calc{background:rgba(255,255,255,.04);border:1px solid rgba(255,194,26,.35);border-radius:var(--r);padding:1rem 1.1rem;display:grid;grid-template-columns:auto 1fr;gap:1rem 1.25rem;align-items:center;max-width:520px}
.sheet-calc svg{width:120px;height:auto}
.sheet-calc dl{margin:0;display:grid;grid-template-columns:auto auto;gap:.2rem 1rem;font-size:var(--t-sm)}
.sheet-calc dt{color:rgba(255,255,255,.7)} .sheet-calc dd{margin:0;text-align:left;color:#fff}
.sheet-calc .formula{grid-column:1/-1;font-family:var(--mono);font-size:var(--t-xs);color:rgba(255,255,255,.8);direction:ltr;text-align:left;border-top:1px dashed rgba(255,255,255,.3);padding-top:.6rem}
.sheet-tags{display:flex;flex-wrap:wrap;gap:.4rem}
.sheet-tags span{border:1px solid rgba(255,194,26,.45);color:var(--on-dark);padding:.15rem .6rem;border-radius:99px;font-size:var(--t-xs)}

/* ---------- SHELL ---------- */
.shell{display:grid;grid-template-columns:var(--rail-w,232px) minmax(0,1fr);min-height:100%}
.rail{background:var(--charcoal);color:var(--on-dark);padding:1.25rem .85rem;display:flex;flex-direction:column;gap:1.5rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100%}
.nav{display:flex;flex-direction:column;gap:.2rem}
.nav button{display:flex;align-items:center;gap:.65rem;background:none;border:none;padding:.6rem .7rem;border-radius:var(--r);cursor:pointer;color:var(--on-dark-2);font-weight:500;text-align:start}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--charcoal-2);color:var(--on-dark)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:.6rem;font-size:var(--t-sm)}
.rail .btn.ghost{color:var(--on-dark-2)}
.rail .btn.ghost:hover{background:var(--charcoal-2);border-color:transparent;color:var(--on-dark)}
.rail .who-mail{color:var(--on-dark-2)}
.who{display:flex;align-items:center;gap:.6rem;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;flex:none;font-family:var(--display)}
.who-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-mail{font-size:var(--t-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
main{padding:1.75rem clamp(1rem,3vw,2.5rem) 3rem;display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.page-head .actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* ---------- DASHBOARD ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--raised);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.25rem}
.tile .v{font-family:var(--mono);font-size:1.65rem;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;line-height:1.2}
.tile .v small{font-size:var(--t-sm);color:var(--muted);font-family:var(--body);margin-inline-start:.25rem}
.tile .sub{font-size:var(--t-xs);color:var(--muted)}
.tile.steel .v{color:var(--rebar)}

.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.panel-head p{font-size:var(--t-xs);color:var(--muted)}

.hbars{display:flex;flex-direction:column;gap:.55rem;flex:1;justify-content:space-around}
.hbar{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 5.5rem;align-items:center;gap:.6rem;font-size:var(--t-sm);padding:2px 0;cursor:default}
.hbar .track{height:var(--bar-h,14px);transition:height .2s;background:transparent;position:relative;border-inline-start:1px solid var(--line)}
.hbar .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;transition:width .4s ease}
[dir="rtl"] .hbar .fill{border-radius:4px 0 0 4px}
.hbar.steel .fill{background:var(--rebar)}
.hbar .val{text-align:left;color:var(--ink-2)}
.hbar:hover .fill{filter:brightness(1.12)}
.hbar:hover .lbl{color:var(--ink)}
.axis{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 5.5rem;gap:.6rem;font-size:var(--t-xs);color:var(--muted)}
.axis .ticks{display:flex;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:.2rem}

.ratio{display:flex;flex-direction:column;gap:.7rem;flex:1;justify-content:space-around}
/* resizable panels */
.panels{grid-auto-flow:row dense}
.panels-tip{margin-bottom:-.75rem}
.rz-panel{position:relative;overflow:hidden}
.rz-panel.editing{outline:2px dashed var(--brand);outline-offset:3px;overflow:visible;user-select:none}
.rz-panel.dragging{transition:none}
.rz-panel.editing,[data-hover="1"] .rz-panel.editing:hover{transform:none;box-shadow:var(--shadow)}
.rz,.rz-tools{display:none}
.rz-panel.editing .rz,.rz-panel.editing .rz-tools{display:flex}
.rz{position:absolute;background:var(--raised);border:2px solid var(--brand);z-index:3;touch-action:none}
.rz-x{top:50%;inset-inline-end:-9px;width:12px;height:40px;margin-top:-20px;border-radius:6px;cursor:ew-resize}
.rz-y{left:50%;bottom:-9px;width:40px;height:12px;margin-left:-20px;border-radius:6px;cursor:ns-resize}
.rz-xy{bottom:-9px;inset-inline-end:-9px;width:16px;height:16px;border-radius:3px;background:var(--brand);cursor:nwse-resize}
[dir="rtl"] .rz-xy{cursor:nesw-resize}
.rz-tools{position:absolute;top:.6rem;inset-inline-end:.6rem;gap:.3rem;align-items:center;z-index:4;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:.25rem;box-shadow:var(--shadow)}
.rz-tools button{background:transparent;border:1px solid transparent;border-radius:4px;padding:.2rem .55rem;font-size:var(--t-xs);font-weight:600;color:var(--ink-2);cursor:pointer}
.rz-tools button:hover{border-color:var(--line)}
.rz-tools button.on{background:var(--brand);color:var(--brand-ink)}
.rz-size{font-size:var(--t-xs);color:var(--muted);padding:0 .35rem}
.ratio-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 4.5rem;gap:.6rem;align-items:center;font-size:var(--t-sm)}
.ratio-track{position:relative;height:22px;border-bottom:1px solid var(--line-2)}
.ratio-band{position:absolute;top:5px;height:12px;background:var(--ok-soft);border-radius:3px}
.ratio-dot{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--rebar);border:2px solid var(--raised);transform:translateX(50%)}
/* left-to-right (English) overrides for the few physically aligned pieces */
[dir="ltr"] .ratio-dot{transform:translateX(-50%)}
[dir="ltr"] .tile .v,[dir="ltr"] .who-mail{text-align:left}
[dir="ltr"] .hbar .val{text-align:right}
.lang-btn{font-family:var(--body);font-weight:600;letter-spacing:.02em}
.lang-btn svg{width:20px;height:20px}
.mobile-bar nav svg{width:18px;height:18px;vertical-align:-4px}
.drawing-head{align-items:center}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.view-toggle button{background:transparent;border:none;padding:.15rem .6rem;font-family:var(--mono);font-size:var(--t-xs);font-weight:600;color:var(--muted);cursor:pointer}
.view-toggle button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
/* drawings are laid out in absolute coordinates: keep their text left-to-right in both languages */
.drawing svg{direction:ltr;unicode-bidi:isolate}
.drawing-body.d3{padding:0;position:relative;display:block;cursor:grab;touch-action:none;min-height:220px}
.drawing-body.d3 canvas{display:block;width:100%}
.d3-hint,.d3-dims{position:absolute;bottom:.45rem;font-size:var(--t-xs);color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--raised) 80%,transparent);padding:.1rem .4rem;border-radius:3px}
.d3-hint{inset-inline-start:.5rem}
.d3-dims{inset-inline-end:.5rem}
@media (max-width:440px){.d3-hint{display:none}}
.hbar .fill{background:var(--conc)}

/* ---------- LANDING / SIGN-IN HERO (always dark: sits on a drawn skyline) ---------- */
.landing{min-height:100%;display:flex;flex-direction:column;background:var(--charcoal)}
.hero{position:relative;min-height:clamp(620px,100svh,920px);display:flex;flex-direction:column;color:#fff;overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block;background:#3A3022}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,12,9,.6) 0%,rgba(14,12,9,.12) 30%,rgba(14,12,9,.3) 62%,rgba(14,12,9,.92) 100%)}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,3rem);flex-wrap:wrap}
.topnav .brand{color:#fff}
.topnav nav{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}
.topnav nav button{background:none;border:none;color:rgba(255,255,255,.9);font-weight:600;padding:.45rem .7rem;cursor:pointer;border-radius:var(--r);display:inline-flex;gap:.4rem;align-items:center;font-size:var(--t-sm)}
.topnav nav button:hover{color:var(--brand)}
.topnav nav svg{width:20px;height:20px}
.hero-inner{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,400px);gap:clamp(1.5rem,5vw,5rem);align-items:center;padding:1.5rem clamp(1rem,4vw,3rem) 3rem}
.hero-copy{display:flex;flex-direction:column;gap:1rem;align-items:flex-start;min-width:0;max-width:100%}
.hero-copy .eyebrow{color:var(--brand);letter-spacing:.16em;font-weight:600;text-transform:uppercase}
.hero-title{font-size:clamp(2.3rem,5.6vw,4.8rem);line-height:1.05;color:#fff;letter-spacing:-.01em;max-width:13ch;text-shadow:0 2px 28px rgba(0,0,0,.4);font-weight:800}
/* Latin capitals run much wider than Arabic: smaller size and a wider measure keep the longest word inside the column */
.hero-title{max-width:min(13ch,100%)}
[lang="en"] .hero-title{text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1.9rem,4vw,3.5rem);max-width:min(17ch,100%);line-height:1.08}
/* word-by-word motion: each word is clipped by its own box */
.hero-title .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em 0 .2em;margin:-.08em 0 -.2em}
.hero-title .wi{display:inline-block}
.hero-title.in .wi{animation:word-in calc(var(--dur,350ms) * 2) cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 70ms)}
.hero-title.out .wi{animation:word-out 340ms cubic-bezier(.6,0,.8,.4) forwards;animation-delay:calc(var(--k) * 35ms)}
@keyframes word-in{from{transform:translateY(115%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes word-out{to{transform:translateY(-115%);opacity:0}}
.hero-sub.sub-in{animation:sub-in calc(var(--dur,350ms) * 2) ease both;animation-delay:220ms}
.hero-sub.sub-out{animation:sub-out 300ms ease forwards}
@keyframes sub-in{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
@keyframes sub-out{to{opacity:0;transform:translateY(-6px);filter:blur(3px)}}
.hero-sub{font-size:clamp(1rem,1.6vw,1.25rem);color:rgba(255,255,255,.86);max-width:44ch;min-height:3.2em}
.slide-fade{animation:cc-rise 600ms cubic-bezier(.2,.7,.2,1) both}
.hero-ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
.btn-solid,.btn-outline{padding:.8rem 1.5rem;font-weight:600;cursor:pointer;border-radius:2px;font-size:var(--t-sm);font-family:var(--body);transition:background .2s,color .2s,border-color .2s}
.btn-solid{background:var(--brand);border:2px solid var(--brand);color:var(--brand-ink)}
.btn-solid:hover{filter:brightness(1.08)}
.btn-outline{background:transparent;border:2px solid #fff;color:#fff}
.btn-outline:hover{background:#fff;color:#1B1A17}
.dots{display:flex;gap:.5rem;margin-top:1.75rem}
.dots button{position:relative;overflow:hidden;width:10px;height:10px;border-radius:5px;border:none;background:rgba(255,255,255,.4);cursor:pointer;padding:0;transition:width .4s cubic-bezier(.2,.8,.2,1),background .3s}
.dots button[aria-current="true"]{background:rgba(255,255,255,.28);width:48px}
.dots .bar{position:absolute;top:0;bottom:0;inset-inline-start:0;width:0;background:var(--brand);border-radius:inherit}
.dots button[aria-current="true"] .bar{animation:dot-fill 6s linear forwards}
.dots:hover .bar{animation-play-state:paused}
@keyframes dot-fill{to{width:100%}}
.glass{background:rgba(18,16,13,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--brand);border-radius:var(--r);padding:1.6rem;color:#F2F0EA;max-width:none}
.glass h2{color:#fff}
.glass .muted,.glass .note{color:rgba(255,255,255,.66)}
.glass .tabs{border-color:rgba(255,255,255,.18)}
.glass .tab{color:rgba(255,255,255,.6)}
.glass .tab[aria-selected="true"]{color:#fff;border-color:var(--brand)}
.glass .field label{color:rgba(255,255,255,.82)}
.glass .input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);color:#fff}
.glass .input::placeholder{color:rgba(255,255,255,.4)}
.glass .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.glass .field .msg{color:#FFA89C}
.glass .field.err .input{border-color:#FFA89C;box-shadow:none}
.glass .form-err{background:rgba(255,90,70,.16);color:#FFB8AE}
.about{background:var(--bg);color:var(--ink);padding:clamp(2.5rem,6vw,4.5rem) clamp(1rem,4vw,3rem);scroll-margin-top:1rem}
.about-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(1.5rem,5vw,4rem)}
.about .eyebrow{color:var(--accent);letter-spacing:.14em;font-weight:600;text-transform:uppercase}
.about h2{font-size:clamp(1.6rem,3vw,2.4rem);margin:.35rem 0 .9rem}
.about .lead{font-size:var(--t-lg);line-height:1.75;max-width:50ch}
.about .more{color:var(--ink-2);max-width:56ch;margin-top:.8rem;line-height:1.75}
.who-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.who-chips span{border:1px solid var(--line);background:var(--raised);padding:.25rem .8rem;border-radius:99px;font-size:var(--t-sm)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.85rem}
.steps li{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:1rem;align-items:start;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.steps .n{width:3rem;height:3rem;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-family:var(--display);font-weight:800;font-size:1.3rem;border-radius:var(--r)}
.steps b{font-family:var(--display);font-size:var(--t-md);display:block;margin-bottom:.15rem}
.steps li span:not(.n){color:var(--ink-2);font-size:var(--t-sm);line-height:1.7}
.gets{max-width:1180px;margin:2.25rem auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gets div{background:var(--raised);padding:1.1rem;display:flex;flex-direction:column;gap:.25rem}
.gets .k{font-family:var(--display);font-weight:700;font-size:1.35rem}
.gets .d{font-size:var(--t-xs);color:var(--muted)}
.about-note{max-width:1180px;margin:1rem auto 0;font-size:var(--t-sm);color:var(--muted)}
.landing .site-foot{border-radius:0;margin:0;border-top:1px solid rgba(255,255,255,.08)}
@media (max-width:900px){
  .hero-inner{grid-template-columns:minmax(0,1fr)}
  .about-grid{grid-template-columns:minmax(0,1fr)}
  .gets{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:440px){.topnav .nav-text{display:none}}

/* ---------- MOTION (driven by the design panel) ---------- */
@keyframes cc-fade{from{opacity:0}}
@keyframes cc-rise{from{opacity:0;transform:translateY(14px)}}
@keyframes cc-slide{from{opacity:0;transform:translateX(calc(var(--dir,1) * 28px))}}
@keyframes cc-zoom{from{opacity:0;transform:scale(.96)}}
[dir="rtl"]{--dir:-1}
.enter>*{animation:var(--enter-anim,none) var(--dur,350ms) cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.btn,.proj,.panel,.chip,.mode-switch button{transition:transform var(--dur,350ms) ease,box-shadow var(--dur,350ms) ease,background .15s,border-color .15s,color .15s}
[data-hover="1"] .btn:not([disabled]):hover,[data-hover="1"] .mode-switch button:hover{transform:translateY(-2px)}
[data-hover="1"] .proj:hover,[data-hover="1"] .panel:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* ---------- DESIGN PANEL ---------- */
.designer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(340px,100%);background:var(--raised);color:var(--ink);border-inline-start:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.22);z-index:80;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:var(--body)}
.dz-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.85rem 1rem;background:var(--charcoal);color:var(--on-dark)}
.dz-head b{font-family:var(--display);font-size:var(--t-md)}
.dz-close{background:none;border:none;color:inherit;font-size:1.5rem;line-height:1;cursor:pointer;padding:0 .25rem}
.dz-body{overflow:auto;flex:1;padding:1rem;display:flex;flex-direction:column;gap:1.4rem}
.dz-sec{display:flex;flex-direction:column;gap:.75rem}
.dz-sec h4{margin:0;font-family:var(--display);font-size:var(--t-sm);color:var(--ink);padding-bottom:.35rem;border-bottom:1px solid var(--line-2)}
.dz-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:var(--t-sm)}
.dz-color{display:flex;gap:.4rem;align-items:center}
.dz-color input[type="color"]{width:36px;height:30px;border:1px solid var(--line);border-radius:4px;padding:2px;background:var(--raised);cursor:pointer}
.dz-color input[type="text"]{width:6rem;font-family:var(--mono);font-size:var(--t-xs);padding:.3rem .4rem;border:1px solid var(--line);border-radius:4px;background:var(--raised);direction:ltr;text-align:left}
.dz-color input.bad{border-color:var(--bad)}
.dz-range{display:flex;flex-direction:column;gap:.2rem;font-size:var(--t-sm)}
.dz-range .top{display:flex;justify-content:space-between;gap:.5rem}
.dz-range output{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);direction:ltr}
.dz-range input{width:100%;accent-color:var(--brand)}
.dz-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.dz-preset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.5rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;text-align:start;font-size:var(--t-xs);color:var(--ink)}
.dz-preset:hover{border-color:var(--ink-2)}
.dz-preset .sw{display:flex;height:18px;border-radius:3px;overflow:hidden}
.dz-preset .sw i{flex:1}
.dz-check{display:flex;align-items:center;gap:.5rem;font-size:var(--t-sm);cursor:pointer}
.dz-check input{width:18px;height:18px;accent-color:var(--brand)}
.dz-foot{border-top:1px solid var(--line);padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:var(--t-xs);color:var(--muted);flex-wrap:wrap}

/* ---------- FOOTER ---------- */
.site-foot{background:var(--charcoal);color:var(--on-dark);border-radius:var(--r);padding:1.75rem clamp(1.25rem,3vw,2rem);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1.25rem;margin-top:1rem}
.foot-brand{display:flex;flex-direction:column;gap:.55rem}
.foot-name{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:2.4rem;line-height:1;direction:ltr;text-align:start}
.foot-by{color:var(--on-dark-2);font-size:var(--t-sm)}
.socials{display:flex;gap:.5rem}
.socials a{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);color:var(--on-dark);border-radius:2px;transition:border-color .15s,color .15s}
.socials a:hover,.socials a:focus-visible{border-color:var(--brand);color:var(--brand)}
.socials svg{width:20px;height:20px}
.foot-copy{font-size:var(--t-xs);color:var(--on-dark-2)}
.auth .site-foot{grid-column:1/-1;border-radius:0;margin:0}
@media (max-width:860px){
  body .mobile-bar{background:var(--charcoal);border-color:var(--charcoal);color:var(--on-dark)}
  body .mobile-bar nav button{color:var(--on-dark-2)}
  body .mobile-bar nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
}
.ratio-dot.out{background:var(--bad)}
.ratio-axis{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:.35rem;vertical-align:-1px}

.projects{display:flex;flex-direction:column;gap:.75rem}
.proj{background:var(--raised);border:1px solid var(--line);border-radius:var(--r)}
.proj-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:1rem;align-items:center;padding:.85rem 1.1rem;cursor:pointer}
.proj-head:hover{background:var(--surface)}
.proj-title{display:flex;flex-direction:column;min-width:0}
.proj-title b{font-family:var(--display);font-weight:600;font-size:var(--t-md)}
.proj-title span{font-size:var(--t-xs);color:var(--muted)}
.qty{display:flex;flex-direction:column;align-items:flex-end;font-size:var(--t-xs);color:var(--muted)}
.qty .num{font-size:var(--t-md);color:var(--ink)}
.qty.steel .num{color:var(--rebar)}
.chev{transition:transform .2s;color:var(--muted)}
.proj.open .chev{transform:rotate(180deg)}
.proj-body{border-top:1px solid var(--line-2);padding:.75rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.75rem}
.pill{display:inline-block;font-size:.6875rem;padding:.05rem .5rem;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-inline-start:.4rem;vertical-align:1px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th{font-weight:500;color:var(--muted);font-size:var(--t-xs);text-align:start;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
td{padding:.5rem;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.n,th.n{text-align:left}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:var(--t-xs);padding:.05rem .45rem;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.proj-actions{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:2rem 1.25rem;text-align:center;display:flex;flex-direction:column;gap:.75rem;align-items:center;background:var(--surface)}
.empty p{max-width:46ch;color:var(--ink-2)}

/* ---------- CALCULATOR ---------- */
.el-tabs{display:flex;gap:.35rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:.3rem;border-radius:calc(var(--r) + 2px);width:fit-content;max-width:100%}
.el-tabs button{background:none;border:none;padding:.45rem .9rem;border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:.45rem}
.el-tabs button svg{width:16px;height:16px}
.el-tabs button[aria-selected="true"]{background:var(--raised);color:var(--accent);box-shadow:var(--shadow)}
.calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.sheet{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;display:flex;flex-direction:column;gap:1.25rem}
fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem}
legend{font-family:var(--display);font-weight:600;font-size:var(--t-md);padding:0;margin-bottom:.1rem;display:flex;gap:.5rem;align-items:baseline}
legend small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:var(--t-xs)}
.grid-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.hint{font-size:var(--t-xs);color:var(--muted);background:var(--surface);border-radius:var(--r);padding:.55rem .75rem;border-inline-start:3px solid var(--line)}

.results{display:flex;flex-direction:column;gap:1rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem)}
.drawing{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.drawing-head{display:flex;justify-content:space-between;padding:.55rem .85rem;border-bottom:1px solid var(--line-2);font-size:var(--t-xs);color:var(--muted)}
.drawing-body{background-color:var(--raised);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;padding:.75rem;display:flex;justify-content:center}
.drawing svg{width:100%;max-width:380px;height:auto;display:block}

.boq{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.boq-top{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.boq-top>div{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.15rem}
.boq-top>div+div{border-inline-start:1px solid var(--line)}
.big{font-family:var(--mono);font-size:2rem;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.big small{font-size:var(--t-sm);color:var(--muted);font-family:var(--body)}
.big.steel{color:var(--rebar)}
.boq-sec{padding:.8rem 1.1rem;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:.45rem}
.boq-sec:last-child{border-bottom:none}
.kv{display:flex;justify-content:space-between;gap:1rem;font-size:var(--t-sm)}
.kv span:first-child{color:var(--ink-2)}
.boq-actions{display:flex;gap:.5rem;padding:.85rem 1.1rem;background:var(--surface);flex-wrap:wrap}
.boq-actions .btn.primary{flex:1;justify-content:center}
.status{display:flex;gap:.5rem;align-items:flex-start;font-size:var(--t-sm);padding:.6rem .8rem;border-radius:var(--r)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status svg{width:16px;height:16px;flex:none;margin-top:3px}
.blocked .boq-top,.blocked .boq-sec{opacity:.35}

/* ---------- MODAL / TOAST / TIP ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.45);display:grid;place-items:center;padding:1rem;z-index:50}
.modal{background:var(--raised);border:1px solid var(--line);border-radius:calc(var(--r) + 2px);width:100%;max-width:440px;padding:1.3rem;display:flex;flex-direction:column;gap:1rem;box-shadow:var(--shadow)}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-start}
.toast{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:var(--r);font-size:var(--t-sm);z-index:60;box-shadow:var(--shadow)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:var(--t-xs);padding:.4rem .6rem;border-radius:4px;z-index:70;white-space:nowrap;line-height:1.5}
.tip .num{font-size:var(--t-sm)}
.mobile-bar{display:none}

/* ---------- FINAL REPORT (BOQ sheet) ---------- */
.report{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1rem,3vw,2rem);display:flex;flex-direction:column;gap:1.5rem}
.rep-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem 2rem;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:1rem}
.rep-co input{font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,2.4vw,1.7rem);color:var(--boq-title);border:1px dashed transparent;background:transparent;width:100%;padding:.2rem .3rem;border-radius:4px}
.rep-co input:hover,.rep-co input:focus{border-color:var(--line);outline:none;background:var(--surface)}
.rep-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .75rem;align-items:center;font-size:var(--t-sm)}
.rep-meta label{font-weight:600}
.rep-meta input{border:none;border-bottom:1px dotted var(--muted);background:transparent;padding:.15rem .2rem;min-width:0;width:100%}
.rep-meta input:focus{outline:none;border-bottom:1px solid var(--accent)}
.rep-sec{display:flex;flex-direction:column;gap:.6rem}
.rep-sec h3{color:var(--boq-title);font-size:var(--t-lg)}
.boq-t{border-collapse:collapse;width:100%;min-width:720px;font-size:var(--t-sm);border:2px solid var(--ink)}
.boq-t th{background:var(--boq-head);color:var(--boq-head-ink);font-family:var(--display);font-weight:600;font-size:var(--t-sm);text-align:center;border:1px solid var(--ink);padding:.5rem .4rem}
.boq-t td{border-inline:1px solid var(--ink);border-bottom:1px dashed var(--muted);padding:.45rem .5rem;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.boq-t td.desc{font-family:var(--body);text-align:center;font-weight:500}
.boq-t td.tot{font-weight:600}
.boq-t tfoot td{border-top:2px solid var(--ink);border-bottom:none;background:var(--surface);font-weight:600}
.boq-t tfoot td.lbl{font-family:var(--display);text-align:start}
.boq-t tr.grp td{background:var(--surface);font-family:var(--display);font-weight:600;text-align:start;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);color:var(--boq-title)}
.boq-t tr.sub td{font-weight:600;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.boq-t tr.sub td.lbl{font-family:var(--body);text-align:start;font-size:var(--t-xs)}
.ded{width:4.5rem;text-align:center;border:1px solid transparent;background:transparent;border-radius:4px;padding:.15rem;font-family:var(--mono)}
.ded:hover{border-color:var(--line)}
.ded:focus{outline:none;border-color:var(--accent);background:var(--raised)}
.ded.bad{border-color:var(--bad);background:var(--bad-soft)}
.rep-note{font-size:var(--t-xs);color:var(--muted)}
.mode-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;max-width:620px}
.mode-switch button{display:flex;align-items:center;gap:.75rem;text-align:start;background:var(--raised);border:1.5px solid var(--line);border-radius:var(--r);padding:.75rem .95rem;cursor:pointer;color:var(--ink-2)}
.mode-switch button svg{width:26px;height:26px;flex:none}
.mode-switch button span{display:flex;flex-direction:column;line-height:1.35}
.mode-switch button b{font-family:var(--display);font-weight:600;font-size:var(--t-md);color:var(--ink)}
.mode-switch button small{font-size:var(--t-xs);color:var(--muted)}
.mode-switch button:hover{border-color:var(--ink-2)}
#mode-conc[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#mode-steel[aria-selected="true"]{border-color:var(--rebar);background:var(--rebar-soft);color:var(--rebar)}
.mode-switch.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:940px}
#mode-fin[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:640px){.mode-switch.three{grid-template-columns:minmax(0,1fr)}}
.types{display:flex;flex-direction:column;gap:.55rem;padding-bottom:1rem;border-bottom:1px solid var(--line-2)}
.types-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.types-head small{color:var(--muted);font-size:var(--t-xs)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);overflow:hidden}
.chip button{background:none;border:none;cursor:pointer;color:var(--ink-2);font-weight:600;font-family:var(--display);padding:.3rem .8rem;font-size:var(--t-sm)}
.chip .x{padding:.3rem .55rem .3rem .2rem;color:var(--muted);font-family:var(--body);font-weight:400}
.chip .x:hover{color:var(--bad)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on button{color:var(--accent)}
.chip.err{border-color:var(--bad)}
.chip.err button:first-child{color:var(--bad)}
.chip-add{border-style:dashed;background:transparent}
.kind-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;padding-bottom:1rem;border-bottom:1px solid var(--line-2)}

<div id="app" dir="rtl" lang="ar"></div>

<script>
(function(){

/* ================== storage (local to this browser) ================== */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};

/* ================== language ================== */
let LANG=store.get('cc.lang','ar')==='en'?'en':'ar';
const L=(ar,en)=>LANG==='en'?en:ar;            // pick the string for the current language
const tr=x=>Array.isArray(x)?L(x[0],x[1]):x;   // resolve an [ar,en] pair
const listSep=()=>L('، ',', ');
function applyLang(){
  const app=document.getElementById('app');
  app.dir=L('rtl','ltr');app.lang=LANG;
  document.documentElement.lang=LANG;
  document.title='ConcreteCalc';
}

/* ================== helpers ================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d}):'—';
const fmtF=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=s=>{try{return new Date(s).toLocaleDateString(L('ar-EG-u-nu-latn','en-GB'),{year:'numeric',month:'short',day:'numeric'})}catch(e){return s}};
// numbers for every input; lists (e.g. door/window rows) are kept as they are
const numObj=o=>Object.fromEntries(Object.entries(o||{}).map(([k,x])=>[k,Array.isArray(x)?x:+x]));
// deep copy for inputs that hold lists, so types and saved items never share a row
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=(a,f)=>a.reduce((t,x)=>t+(typeof f==='function'?f(x):x[f]),0);
const M3=()=>L('م³','m³');

/* ================== engineering ================== */
const DIAS=[8,10,12,14,16,18,20,22,25,32];
const BAR_LEN=12;                         // stock bar length, m
const wpm=d=>d*d/162;                     // kg per metre for bar Ø d (mm)
const LAP_DEF=50;                         // default lap splice, in bar diameters
const lap=(d,k)=>(+k||LAP_DEF)*d/1000;    // lap splice length, m (k = multiple of Ø, set per type)
const anch=d=>40*d/1000;                  // anchorage each end, m
// bottom bend (قنشة) of a column bar: a multiple of its diameter, only when the bar goes into a footing, m
// depth of the column bar inside the footing, m: typed in (embm 1) or worked out from the footing (embm 2) as
// thickness − bottom cover − the two bottom-mesh layers, so the bar stands on the mesh
const fromFooting=v=>+(v&&v.embm)===2;
const embLen=v=>fromFooting(v)?Math.max(0,((+v.fD||0)-(+v.fc||0))/100-((+v.fdx||0)+(+v.fdy||0))/1000):(+v.emb||0)/100;
const hookLen=(v,d)=>embLen(v)>0?(+v.hkd||0)*d/1000:0;
// starter bars above the column: a fixed multiple of the bar diameter, m
const starterLen=(v,d)=>(+v.st||LAP_DEF)*d/1000;
// one column bar: into the footing + bottom bend + clear height + through the slab + starters for the next floor, m
const colBar=(v,d)=>embLen(v)+hookLen(v,d)+(+v.H)+(+v.ts||0)/100+starterLen(v,d);
// length of one continuous run of bar, adding a lap for every 12 m stock length exceeded
const runLen=(L_,d,k)=>L_+Math.max(0,Math.ceil(L_/BAR_LEN)-1)*lap(d,k);
// lap field shared by every element; the label shows the length it gives for the main bar
const mainDia=v=>twoMesh(v)&&v.dBL?+v.dBL:(+v.xy===2&&v.dbx)?+v.dbx:+(v.db||v.dB||v.d1||v.d||16);
const LAP_FIELD=()=>F('lp',v=>[`وصلة التراكب (= ${fmtF(lap(mainDia(v),v.lp),2)} م)`,`Lap length (= ${fmtF(lap(mainDia(v),v.lp),2)} m)`],['× القطر','× Ø'],20,100,1);

const ICONS={
  column:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="3" width="8" height="18" rx="1"/><path d="M8 8h8M8 13h8M8 18h8"/></svg>',
  tie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="9" width="20" height="6" rx="1"/><path d="M7 9v6M12 9v6M17 9v6"/></svg>',
  grade:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="12" width="20" height="7" rx="1"/><path d="M2 8h20" stroke-dasharray="2 2"/></svg>',
  slab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-5 9 5-9 5z"/><path d="M3 9v3l9 5 9-5V9"/></svg>',
  footing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="14" width="18" height="6" rx="1"/><rect x="9" y="4" width="6" height="10"/></svg>',
  combined:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="14" width="20" height="6" rx="1"/><rect x="5" y="5" width="4" height="9"/><rect x="15" y="5" width="4" height="9"/></svg>',
  earth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8h5l3 10h4l3-10h5"/><path d="M15 3l4 4M17 2l-4 4"/></svg>',
};

const U={cm:['سم','cm'],m:['م','m'],m2:['م²','m²'],mm:['مم','mm'],no:['عدد','no.'],bars:['سيخ','bars'],none:['','']};
// columns and beams: bars entered the usual way (xy 1) or as a count per direction (xy 2):
// X = bars on each b face (top/bottom for beams), Y = bars on each h face (sides); both counts include the corners
const isXY=v=>+(v&&v.xy)===2;
const XY_FIELDS=()=>[
  F('nbx',['عدد الأسياخ في اتجاه X (شامل الأركان)','Bars in X direction (incl. corners)'],U.bars,2,20,1,{when:isXY}),
  Object.assign(DIA('dbx',['قطر أسياخ X','X bar Ø']),{when:isXY}),
  F('nby',['عدد الأسياخ في اتجاه Y (شامل الأركان)','Bars in Y direction (incl. corners)'],U.bars,2,20,1,{when:isXY}),
  Object.assign(DIA('dby',['قطر أسياخ Y','Y bar Ø']),{when:isXY})];
const notXY=v=>!isXY(v);
// bars in X and Y, total counts per member; Y counts only the bars between the corners
const xyBars=(v,n,len)=>[
  {role:L('اتجاه X','X direction'),d:v.dbx,count:n*2*Math.round(v.nbx),len:len(v.dbx)},
  {role:L('اتجاه Y','Y direction'),d:v.dby,count:n*2*Math.max(0,Math.round(v.nby)-2),len:len(v.dby)}].filter(b=>b.count>0);
function xyCheck(v,e){
  const fit=(len,n,d)=>n*d/10+(n-1)*2.5<=len-2*v.c-2*v.ds/10;
  const m=L('الأسياخ لا تتسع على هذا الوجه مع مسافة 2.5 سم بينها. قلّل العدد أو القطر.','The bars do not fit on this face with 2.5 cm between them. Use fewer or thinner bars.');
  if(!fit(v.b,v.nbx,v.dbx))e.nbx=m;
  if(!fit(v.h,v.nby,Math.max(v.dbx,v.dby)))e.nby=m;
}
// bars are now always given per direction; older saved columns/beams are converted once,
// carrying their bars across so the steel stays about the same (8 bars → 3 × 3)
function toXY(type,i){
  if(!['column','tie','grade'].includes(type)||isXY(i))return i;
  if(type==='column'){const n=Math.max(4,Math.round(+i.nb||8)),nx=Math.max(2,Math.round(n/4)+1);
    i.nbx=nx;i.nby=Math.max(2,Math.round((n-2*nx+4)/2));i.dbx=i.db||16;i.dby=i.db||16}
  else{i.nbx=Math.max(+i.nbB||2,+i.nbT||2);i.dbx=i.dB||16;i.nby=2;i.dby=i.dby||12}
  i.xy=2;return i;
}
// finishes on walls: count × length (lm 1) or one total of running metres (lm 2)
const byRun=v=>+(v&&v.lm)===2;
// running metres can already include the storey height (hi 2): then the figure is the wall area itself
const runHasHeight=v=>byRun(v)&&+v.hi===2;
// wall-by-wall rows {c (count), l (length), h (height)}; items saved before rows existed had one row in n/L/W
const wallRows=v=>Array.isArray(v&&v.walls)?v.walls:[{c:+(v&&v.n)||1,l:+(v&&v.L)||0,h:+(v&&v.W)||0}];
const wallRowArea=r=>Math.max(0,+r.c||0)*Math.max(0,+r.l||0)*Math.max(0,+r.h||0);
const RUN_FIELDS=()=>[
  F('TL',v=>runHasHeight(v)?['إجمالي الأمتار (شاملة ارتفاع الطابق)','Total, including storey height']:['إجمالي الأمتار الطولية','Total running metres'],
    v=>runHasHeight(v)?U.m2:U.m,.1,1000000,.01,{when:byRun})];
// wall height field, hidden when the running metres already include it
const HEIGHT_FIELD=lab=>F('W',lab,U.m,.1,20,.05,{when:v=>byRun(v)&&!runHasHeight(v)});
// openings: one typed total (opm 1) or worked out from doors and windows (opm 2)
const byOpenings=v=>+(v&&v.opm)===2;
// door/window rows {k:'d'|'w', n, w, h}; any number of sizes
// (items saved before rows existed kept one door size and one window size in dn/dw/dh and wn/ww/wh)
const opRows=v=>Array.isArray(v&&v.ops)?v.ops:v&&(v.dn!=null||v.wn!=null)?[{k:'d',n:v.dn,w:v.dw,h:v.dh},{k:'w',n:v.wn,w:v.ww,h:v.wh}]:[];
const opRowArea=r=>Math.max(0,+r.n||0)*Math.max(0,+r.w||0)*Math.max(0,+r.h||0);
const opArea=v=>byOpenings(v)?sum(opRows(v),opRowArea):(+v.op||0);
const OPEN_GROUP=faces=>({t:['الفتحات','Openings'],open:true,f:[F('op',opLabel(faces),U.m2,0,100000,.01,{when:v=>!byOpenings(v)})]});
const OPEN_DEF={opm:1};
const WALL_ROWS=()=>[{c:2,l:5,h:3},{c:2,l:4,h:3}];
const OPEN_ROWS=()=>[{k:'d',n:4,w:.9,h:2.1},{k:'w',n:4,w:1.2,h:1.2}];
// openings on walls are one total for all the walls; with two faces it comes off each face
const opLabel=(faces)=>()=>faces?['إجمالي مساحة الفتحات (تُخصم من كل وجه)','Total openings (deducted from each face)']:['إجمالي مساحة الفتحات','Total openings area'];
// brick walls, mortar 1:6, per m² by wall thickness (half, one, one-and-a-half, two bricks)
const BRICK={n:[75,150,225,300],cement:[10,15,25,35],sand:[.04,.08,.12,.16],
  name:[['نصف طوبة','Half brick'],['طوبة','One brick'],['طوبة ونصف','One and a half bricks'],['طوبتين','Two bricks']]};
const isBrick=v=>+(v&&v.bk)===2;
const spreadN=(n,a,b)=>n<=1?[(a+b)/2]:Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
// column bar positions in a unit square (u across b, w across h, both -1…1) with each bar's diameter
function colLayout(v,iw,ih){
  const pts=[],add=(u,w,d)=>pts.push({u,w,d});
  if(isXY(v)){
    for(const[u,w]of[[-1,-1],[1,-1],[-1,1],[1,1]])add(u,w,v.dbx);
    for(const u of spreadN(Math.round(v.nbx),-1,1).slice(1,-1)){add(u,-1,v.dbx);add(u,1,v.dbx)}
    for(const w of spreadN(Math.round(v.nby),-1,1).slice(1,-1)){add(-1,w,v.dby);add(1,w,v.dby)}
    return pts;
  }
  for(const[u,w]of[[-1,-1],[1,-1],[-1,1],[1,1]])add(u,w,v.db);
  let r=Math.max(4,Math.round(v.nb))-4;const sides=[0,0];let tg=iw>=ih?0:1;
  while(r>=2){sides[tg]++;r-=2;tg=iw/(sides[0]+1)<ih/(sides[1]+1)?1:0}
  for(const u of spreadN(sides[0]+2,-1,1).slice(1,-1)){add(u,-1,v.db);add(u,1,v.db)}
  for(const w of spreadN(sides[1]+2,-1,1).slice(1,-1)){add(-1,w,v.db);add(1,w,v.db)}
  if(r===1)add(0,1,v.db);
  return pts;
}
// footings with a bottom and a top mesh, each set by long/short Ø and spacing: every combined footing,
// and an isolated footing when its mesh count is 2
const twoMesh=v=>+(v&&v.kind)===2||+(v&&v.layers)===2;
// slabs can be entered by length × width (by 1) or by total area (by 2)
const byArea=v=>+(v&&v.by)===2;
// plan size used for bar counts and drawings; an area-only slab is treated as the square with the same area
const slabXY=v=>byArea(v)?{Lx:Math.sqrt(+v.A||0),Ly:Math.sqrt(+v.A||0)}:{Lx:+v.Lx,Ly:+v.Ly};
const F=(k,label,unit,min,max,step,extra={})=>Object.assign({k,label,unit,min,max,step},extra);
// a field's unit may depend on the inputs (e.g. m vs m² for running metres)
const unitOf=(f,v)=>typeof f.unit==='function'?f.unit(v||{}):f.unit;
const DIA=(k,label)=>({k,label,unit:U.mm,dia:true});
const LAYERS=F('layers',['عدد الشبكات','Mesh layers'],U.none,1,2,1,{select:[[1,['شبكة سفلية فقط','Bottom mesh only']],[2,['سفلية وعلوية','Bottom and top']]]});
const COUNT=F('n',['العدد','Count'],U.no,1,500,1);

const ELEMENTS={
  column:{
    name:['الأعمدة','Columns'],prefix:['ع','C'],
    hint:['طول السيخ الرأسي = الطول داخل القاعدة + القنشة + الارتفاع الصافي + سمك السقف + الأشاير للدور التالي. لأعمدة الأدوار العليا اجعل الطول داخل القاعدة صفرًا. الكانة بخطافين 135° بطول 10Ø لكل خطاف.',
          'Vertical bar length = depth into the footing + bottom bend + clear height + slab thickness + starter bars for the next floor. For upper-floor columns set the footing depth to zero. Stirrups have two 135° hooks of 10Ø each.'],
    groups:[
      {t:['الأبعاد','Dimensions'],f:[COUNT,F('b',['العرض b','Width b'],U.cm,15,200,1),F('h',['الطول h','Depth h'],U.cm,15,300,1),F('H',['الارتفاع الصافي','Clear height'],U.m,.5,15,.05),F('c',['الغطاء الخرساني','Concrete cover'],U.cm,2,7.5,.5)]},
      {t:['تسليح العمود','Column reinforcement'],f:[F('nb',['عدد الأسياخ','Number of bars'],U.bars,4,60,1,{when:notXY}),Object.assign(DIA('db',['قطر السيخ','Bar diameter']),{when:notXY}),...XY_FIELDS(),
        F('ts',['سمك السقف فوق العمود','Slab thickness above the column'],U.cm,0,60,1),
        F('st',v=>[`طول الأشاير (= ${fmtF(starterLen(v,mainDia(v)),2)} م)`,`Starter bar length (= ${fmtF(starterLen(v,mainDia(v)),2)} m)`],['× القطر','× Ø'],0,100,1)]},
      {t:['التثبيت في القاعدة','Anchorage in the footing'],f:[
        F('emb',['الطول داخل القاعدة المسلحة','Depth into the footing'],U.cm,0,300,1,{when:v=>!fromFooting(v)}),
        F('fL',['طول القاعدة','Footing length'],U.m,.5,30,.05,{when:fromFooting}),
        F('fW',['عرض القاعدة','Footing width'],U.m,.5,10,.05,{when:fromFooting}),
        F('fD',v=>[`سماكة القاعدة (الطول داخلها = ${fmtF(embLen(v),2)} م)`,`Footing thickness (depth inside = ${fmtF(embLen(v),2)} m)`],U.cm,20,200,1,{when:fromFooting}),
        F('fc',['غطاء القاعدة السفلي','Footing bottom cover'],U.cm,3,10,.5,{when:fromFooting}),
        Object.assign(DIA('fdx',['قطر شبكة القاعدة X','Footing mesh Ø (X)']),{when:fromFooting}),
        Object.assign(DIA('fdy',['قطر شبكة القاعدة Y','Footing mesh Ø (Y)']),{when:fromFooting}),
        F('hkd',v=>[`طول القنشة (= ${fmtF(hookLen(v,mainDia(v)),2)} م)`,`Bottom bend length (= ${fmtF(hookLen(v,mainDia(v)),2)} m)`],['× القطر','× Ø'],0,60,1)]},
      {t:['الكانات','Stirrups'],f:[DIA('ds',['قطر الكانة','Stirrup diameter']),F('s',['المسافة بين الكانات','Stirrup spacing'],U.cm,5,30,.5)]},
    ],
    def:{n:12,b:30,h:50,H:3.2,c:4,lp:LAP_DEF,ts:15,st:LAP_DEF,embm:1,emb:55,fL:1.8,fW:1.6,fD:60,fc:7.5,fdx:16,fdy:16,hkd:20,xy:2,nb:8,db:16,nbx:3,dbx:16,nby:3,dby:16,ds:8,s:15},
    dims:v=>({n:v.n,L:v.b/100,W:v.h/100,H:v.H}),
    check(v){const e={};
      if(2*v.c>=v.b-2)e.c=L('الغطاء أكبر من نصف عرض العمود. قلّل الغطاء أو زد العرض.','Cover is more than half the column width. Reduce the cover or increase the width.');
      if(fromFooting(v)){
        if(embLen(v)<=0)e.fD=L('السماكة لا تكفي بعد خصم الغطاء والشبكة. زد السماكة.','The thickness is used up by the cover and mesh. Increase it.');
        if(v.fL*100<v.b+10)e.fL=L('القاعدة أصغر من العمود.','The footing is smaller than the column.');

    }

async function hash(pw,salt){
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
    return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const s=salt+':'+pw;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return'f'+h.toString(16)}
}

function svgText(x,y,t,o=''){return`<text x="${x}" y="${y}" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="middle" ${o}>${t}</text>`}
function dimH(x1,x2,y,label){return`<path d="M${x1} ${y}H${x2}M${x1} ${y-4}v8M${x2} ${y-4}v8" stroke="var(--muted)" stroke-width="1" fill="none"/>`+svgText((x1+x2)/2,y-6,label)}
function dimV(y1,y2,x,label){return`<path d="M${x} ${y1}V${y2}M${x-4} ${y1}h8M${x-4} ${y2}h8" stroke="var(--muted)" stroke-width="1" fill="none"/>`+svgText(x-8,(y1+y2)/2,label,`transform="rotate(-90 ${x-8} ${(y1+y2)/2})"`)}

function drawSection(type,v){
  v=numObj(v);if(type==='slab')Object.assign(v,slabXY(v));
  const W=380,Hh=260;
  if(type==='column'||type==='tie'||type==='grade'){
    const b=v.b,h=v.h;
    const sc=Math.min(240/b,190/h);
    const w=b*sc,hh=h*sc,x0=(W-w)/2+10,y0=(Hh-hh)/2+8;
    const c=v.c*sc;
    let s=`<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>`;
    s+=`<rect x="${x0+c}" y="${y0+c}" width="${w-2*c}" height="${hh-2*c}" rx="3" fill="none" stroke="var(--rebar)" stroke-width="${Math.max(1.4,(v.ds||8)/10*sc*.5)}"/>`;
    const ix=x0+c,iy=y0+c,iw=w-2*c,ih=hh-2*c;
    if(type==='column'){
      // sc here is px per cm, bar Ø in mm → radius d/20 cm
      s+=colLayout(v,iw,ih).map(p=>`<circle cx="${ix+iw*(p.u+1)/2}" cy="${iy+ih*(p.w+1)/2}" r="${Math.max(3,p.d/20*sc)}" fill="var(--rebar)"/>`).join('');    }else{
      const row=(n,d,y)=>{const rr=Math.max(3,d/20*sc);let o='';for(let i=0;i<n;i++){const x=n===1?ix+iw/2:ix+iw*i/(n-1);o+=`<circle cx="${x}" cy="${y}" r="${rr}" fill="var(--rebar)"/>`}return o};
      // X-Y: the beam section uses the same face-by-face layout as a column
      if(isXY(v))s+=colLayout(v,iw,ih).map(p=>`<circle cx="${ix+iw*(p.u+1)/2}" cy="${iy+ih*(p.w+1)/2}" r="${Math.max(3,p.d/20*sc)}" fill="var(--rebar)"/>`).join('');
      else s+=row(Math.round(v.nbT),v.dT,iy)+row(Math.round(v.nbB),v.dB,iy+ih);
    }
    if(isXY(v))s+=svgText(x0+w/2,y0+hh+22,`X: ${fmt(v.nbx)}Ø${v.dbx} · Y: ${fmt(v.nby)}Ø${v.dby}`);
    s+=dimH(x0,x0+w,y0-10,fmt(b)+' cm')+dimV(y0,y0+hh,x0-14,fmt(h)+' cm');
    return`<svg viewBox="0 0 ${W} ${Hh+10}" role="img" aria-label="${L('مقطع عرضي','Cross-section')}">${s}</svg>`;
  }
  const A=type==='slab'?v.Lx:v.L, B=type==='slab'?v.Ly:v.W;
  const sc=Math.min(260/A,180/B);
  const w=A*sc,hh=B*sc,x0=(W-w)/2+10,y0=(Hh-hh)/2+10;
  let s='';
  if(isFoot(type)&&v.bt>0){const o=.1*sc;s+=`<rect x="${x0-o}" y="${y0-o}" width="${w+2*o}" height="${hh+2*o}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3"/>`}
  s+=`<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>`;
  // plan shows the bottom mesh: horizontal lines = long bars (spaced across the width), vertical lines = short bars
  const comb=isFoot(type)&&twoMesh(v);
  const sx=type==='slab'?(A<=B?v.s1:v.s2):comb?v.sBS:v.s, sy=type==='slab'?(A<=B?v.s2:v.s1):comb?v.sBL:v.s;
  const cp=isFoot(type)?v.c/100*sc:3;
  const lines=(step,len,horiz)=>{let o='';const n=Math.floor(len*100/step);const k=Math.max(1,Math.ceil(n/28));
    for(let i=0;i<=n;i+=k){const p=Math.min(Math.max(i*step/100*sc,cp),(horiz?hh:w)-cp);
      o+=horiz?`<line x1="${x0+cp}" x2="${x0+w-cp}" y1="${y0+p}" y2="${y0+p}"/>`:`<line y1="${y0+cp}" y2="${y0+hh-cp}" x1="${x0+p}" x2="${x0+p}"/>`}
    return o};
  s+=`<g stroke="var(--rebar)" stroke-width="1" opacity=".85">${lines(sy,B,true)}${lines(sx,A,false)}</g>`;
  if(isFoot(type)){const F_=footSpec(type,v),cw=F_.cw*sc,cd=F_.cd*sc;
    for(const cx of F_.cols)s+=`<rect x="${x0+w/2+cx*sc-cw/2}" y="${y0+hh/2-cd/2}" width="${cw}" height="${cd}" fill="var(--raised)" stroke="var(--ink-2)" stroke-dasharray="3 2"/>`;
    if(comb&&F_.cols.length>1)s+=dimH(x0+w/2+F_.cols[0]*sc,x0+w/2+F_.cols[1]*sc,y0+hh+16,fmt(v.sp)+' m');}
  if(type==='slab'&&byArea(v))s+=svgText(x0+w/2,y0-10,`A = ${fmt(v.A)} m² (≈ ${fmt(A,2)} × ${fmt(B,2)} m)`);
  else s+=dimH(x0,x0+w,y0-14,fmt(A)+' m')+dimV(y0,y0+hh,x0-18,fmt(B)+' m');
  return`<svg viewBox="0 0 ${W} ${Hh+10}" role="img" aria-label="${L('مسقط أفقي للتسليح','Reinforcement plan')}">${s}</svg>`;
}

/* ================== 2D section views (vertical / longitudinal cuts) ================== */
function drawCut(type,v){
  v=numObj(v);if(type==='slab')Object.assign(v,slabXY(v));
  const W=380,Hh=270;
  const ink='var(--ink)',reb='var(--rebar)',mut='var(--muted)';
  const T=(x,y,t,a='middle',o='')=>`<text x="${x}" y="${y}" fill="${mut}" font-family="IBM Plex Mono,monospace" font-size="10.5" text-anchor="${a}" ${o}>${t}</text>`;
  const ln=(x1,y1,x2,y2,w=1.6,c=reb,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  const dot=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${reb}"/>`;
  const rect=(x,y,w,h,fill='var(--surface)',extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${ink}" stroke-width="1.6" ${extra}/>`;
  const svg=(s,label)=>`<svg viewBox="0 0 ${W} ${Hh}" direction="ltr" role="img" aria-label="${label}">${s}</svg>`;
  const spread=(n,a,b)=>n<=1?[(a+b)/2]:Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  const thin=(arr,max)=>{const k=Math.max(1,Math.ceil(arr.length/max));return arr.filter((_,i)=>i%k===0||i===arr.length-1)};
  let s='';

  if(isFoot(type)){
    // cut along the footing length: long bars as lines with legs, short bars as dots beside them
    const F_=footSpec(type,v);
    const L_=v.L,D=v.D/100,c=v.c/100,bt=v.bt/100,stub=D*.7;
    const sc=Math.min(290/(L_+.2),150/(D+bt+stub));
    const w=L_*sc,h=D*sc,x0=(W-w)/2+12,yT=36+stub*sc,yB=yT+h,mid=x0+w/2;
    const cw=F_.cw*sc;
    for(const cx of F_.cols)s+=rect(mid+cx*sc-cw/2,yT-stub*sc,cw,stub*sc,'var(--raised)','stroke-dasharray="4 3"');
    if(bt>0)s+=rect(x0-.1*sc,yB,w+.2*sc,bt*sc,'var(--line-2)');
    s+=rect(x0,yT,w,h);
    const cp=c*sc;
    for(const ly of F_.layers){
      const up=ly.top?-1:1,y=ly.top?yT+cp:yB-cp;
      // sc is px per metre and d is in mm: radius = d/2000 m, drawn a little larger so thin bars stay visible
      const rL=Math.min(6,Math.max(2,ly.dL/2000*sc*1.6)),rS=Math.min(6,Math.max(2,ly.dS/2000*sc*1.6));
      const lg=Math.max(.15,12*ly.dL/1000)*sc;
      s+=`<polyline points="${x0+cp},${y-up*lg} ${x0+cp},${y} ${x0+w-cp},${y} ${x0+w-cp},${y-up*lg}" fill="none" stroke="${reb}" stroke-width="${Math.max(1.6,rL*.9)}" stroke-linejoin="round"/>`;
      for(const x of thin(spread(Math.floor((L_-2*c)*100/ly.sS)+1,x0+cp+rS+2,x0+w-cp-rS-2),30))s+=dot(x,y-up*(rL+rS),rS);
    }
    s+=dimH(x0,x0+w,yT-stub*sc-10,fmt(L_)+' m')+dimV(yT,yB,x0-16,fmt(v.D)+' cm');
    if(bt>0)s+=T(x0+w+.1*sc+4,yB+bt*sc/2+4,`${fmt(v.bt)} cm`,'start');
    if(twoMesh(v)){
      s+=T(W/2+12,yB+bt*sc+15,`${L('سفلي','Bottom')} Ø${v.dBL}@${fmt(v.sBL)} / Ø${v.dBS}@${fmt(v.sBS)} · ${L('علوي','Top')} Ø${v.dTL}@${fmt(v.sTL)} / Ø${v.dTS}@${fmt(v.sTS)}`);
      s+=T(W/2+12,yB+bt*sc+30,(kindOf(v)===2?`${fmt(v.nc)} ${L('أعمدة','columns')} @ ${fmt(v.sp)} m · `:'')+`c = ${fmt(v.c)} cm`);
    }else s+=T(W/2+12,yB+bt*sc+16,`Ø${v.d} @ ${fmt(v.s)} cm · c = ${fmt(v.c)} cm`);
    return svg(s,L('قطاع رأسي في القاعدة','Vertical section through the footing'));
  }
  if(type==='slab'){
    // a 2 m strip cut across the short span: main bars along the cut, secondary bars as dots
    const span=Math.min(v.Lx,v.Ly),strip=Math.min(span,2.2),t=v.t/100,c=.025;
    const sc=Math.min(320/strip,110/t);
    const w=strip*sc,h=t*sc,x0=(W-w)/2,yT=(Hh-h)/2-10,yB=yT+h;
    s+=rect(x0,yT,w,h);
    if(span>strip){ // break lines: the strip continues
      const zz=x=>`<polyline points="${x},${yT-8} ${x-5},${yT+h*.35} ${x+5},${yT+h*.65} ${x},${yB+8}" fill="none" stroke="${mut}" stroke-width="1.2"/>`;
      s+=zz(x0)+zz(x0+w);
    }
    const r1=Math.min(6,Math.max(2,v.d1/2000*sc*1.6)),r2=Math.min(6,Math.max(2,v.d2/2000*sc*1.6)),cp=c*sc;
    const layer=(y,up)=>{
      s+=ln(x0+4,y,x0+w-4,y,Math.max(2,r1*1.2));
      for(const x of thin(spread(Math.floor(strip*100/v.s2)+1,x0+8,x0+w-8),28))s+=dot(x,y-up*(r1+r2),r2);
    };
    layer(yB-cp,1);if(v.layers===2)layer(yT+cp,-1);
    s+=dimV(yT,yB,x0-14,fmt(v.t)+' cm');
    s+=T(W/2,yB+30,`${L('رئيسي','Main')} Ø${v.d1} @ ${fmt(v.s1)} cm`);
    s+=T(W/2,yB+46,`${L('ثانوي','Secondary')} Ø${v.d2} @ ${fmt(v.s2)} cm`);
    s+=T(W/2,yT-14,`${L('شريحة','Strip')} ${fmt(strip)} m ${L('من بحر','of a span of')} ${fmt(span)} m`);
    return svg(s,L('قطاع رأسي في البلاطة','Vertical section through the slab'));
  }
  if(type==='column'){
    // elevation: vertical bars with starter bars above, stirrups along the height
    const b=v.b/100,H=v.H,c=v.c/100,ts=(+v.ts||0)/100,lp=starterLen(v,mainDia(v))+ts,emb=embLen(v),hk=hookLen(v,mainDia(v));
    // footing below: the bar runs down `emb` into it and bends sideways by `hk` (القنشة)
    const ff=fromFooting(v),fd=emb>0?(ff?v.fD/100:emb+.08):0;
    const sy=Math.min(205/(H+lp+fd)),sx=Math.max(sy,60/b);
    const w=b*sx,h=H*sy,x0=(W-w)/2+14,yT=26+lp*sy,yB=yT+h;
    // footing drawn to its real length when known, otherwise as a generic block
    const fw=ff?Math.min(330,v.fL*sx):w+120,fx=x0+w/2-fw/2;
    if(fd>0){s+=`<rect x="${fx}" y="${yB}" width="${fw}" height="${fd*sy}" fill="var(--line-2)" stroke="${ink}" stroke-width="1.2"/>`;
      // footing bottom mesh: the column bars stand on it
      if(ff){const ym=yB+fd*sy-v.fc/100*sy;s+=ln(fx+v.fc/100*sx,ym,fx+fw-v.fc/100*sx,ym,1.6,reb,'opacity=".7"')}}
    else s+=`<rect x="${x0-40}" y="${yB}" width="${w+80}" height="10" fill="var(--line-2)" stroke="${ink}" stroke-width="1"/>`;
    // slab above the column at its real thickness; the bars pass through it before the starters begin
    const tsp=Math.max(ts*sy,ts>0?4:0);
    if(tsp>0)s+=`<rect x="${x0-40}" y="${yT-tsp}" width="${w+80}" height="${tsp}" fill="var(--line-2)" stroke="${ink}" stroke-width="1" stroke-dasharray="4 3"/>`;
    s+=rect(x0,yT,w,h);
    // in elevation we see the bars on one X face
    const nF=isXY(v)?Math.min(6,Math.round(v.nbx)):(v.nb>4?3:2);
    const cp=c*sx,xs=spreadN(nF,x0+cp,x0+w-cp);
    const yFoot=yB+emb*sy;
    xs.forEach((x,i)=>{s+=ln(x,yFoot,x,yT-lp*sy,2.2);
      // bends are perpendicular to the bar's face: corner bars bend sideways (X) and show here;
      // bars between the corners bend toward the viewer (Y), so they show end-on as a dot
      if(hk>0&&emb>0){
        if(i===0||i===xs.length-1){const dir=i===0?-1:1;s+=ln(x,yFoot,x+dir*Math.min(hk*sx,55),yFoot,2.2)}
        else s+=dot(x,yFoot,3.2);
      }});
    if(emb>0){s+=dimV(yB,yFoot,Math.min(W-14,fx+fw+14),fmt(emb*100,1)+' cm');
      s+=T(Math.max(40,fx-4),yB+fd*sy/2+4,`${L('قاعدة','Footing')}`,'end')}
    if(hk>0&&emb>0)s+=T(x0+cp-Math.min(hk*sx,55)/2,yFoot+13,`${fmt(v.hkd)}Ø = ${fmtF(hk,2)} m`);
    for(const y of thin(spread(Math.ceil(H*100/v.s)+1,yB-4,yT+4),36))s+=ln(x0+cp-3,y,x0+w-cp+3,y,1.2);
    s+=dimV(yT,yB,x0-48,fmt(H)+' m');
    if(!(emb>0))s+=dimH(x0,x0+w,yB+26,fmt(v.b)+' cm');
    s+=(isXY(v)?T(x0+w+10,yT+h*.35-14,`X ${fmt(v.nbx)}Ø${v.dbx}`,'start')+T(x0+w+10,yT+h*.35,`Y ${fmt(v.nby)}Ø${v.dby}`,'start')
      :T(x0+w+10,yT+h*.35,`${fmt(v.nb)}Ø${v.db}`,'start'))+T(x0+w+10,yT+h*.35+14,`Ø${v.ds} @ ${fmt(v.s)}`,'start');
    s+=T(x0+w+10,yT-(lp+ts)*sy/2,`${L('أشاير','starters')} ${fmt(lp-ts,2)} m`,'start');
    if(ts>0)s+=T(x0-44,yT-tsp/2+4,`${L('سقف','slab')} ${fmt(v.ts)} cm`,'end');
    return svg(s,L('قطاع طولي في العمود','Longitudinal section through the column'));
  }
  // tie / grade beam elevation: top and bottom bars run past the supports by the anchorage length
  const L_=v.L,h_=v.h/100,c=v.c/100,an=isXY(v)?anch(v.dbx):Math.max(anch(v.dB),anch(v.dT));
  const sx=300/(L_+2*an+.6),sy=Math.min(130/h_,Math.max(sx,70/h_));
  const w=L_*sx,h=h_*sy,x0=(W-w)/2,yT=(Hh-h)/2-14,yB=yT+h,sup=.3*sx;
  s+=rect(x0-sup,yT-12,sup,h+40,'var(--line-2)','stroke-dasharray="4 3"')+rect(x0+w,yT-12,sup,h+40,'var(--line-2)','stroke-dasharray="4 3"');
  s+=rect(x0,yT,w,h);
  const cy=c*sy,ax=an*sx;
  s+=ln(x0-ax,yB-cy,x0+w+ax,yB-cy,2.4)+ln(x0-ax,yT+cy,x0+w+ax,yT+cy,2);
  // Y bars between the corners show as dashed lines along the beam
  if(isXY(v))for(const y of spreadN(Math.round(v.nby),yT+cy,yB-cy).slice(1,-1))s+=ln(x0-ax,y,x0+w+ax,y,1.4,reb,'stroke-dasharray="6 3"');
  for(const x of thin(spread(Math.ceil(L_*100/v.s)+1,x0+4,x0+w-4),60))s+=ln(x,yT+cy-3,x,yB-cy+3,1.1);
  s+=dimH(x0,x0+w,yT-22,fmt(L_)+' m')+dimV(yT,yB,x0-sup-12,fmt(v.h)+' cm');
  s+=T(W/2,yB+28,isXY(v)?`X ${fmt(v.nbx)}Ø${v.dbx} · Y ${fmt(v.nby)}Ø${v.dby} · ${L('كانات','Stirrups')} Ø${v.ds} @ ${fmt(v.s)}`
    :`${L('سفلي','Bottom')} ${fmt(v.nbB)}Ø${v.dB} · ${L('علوي','Top')} ${fmt(v.nbT)}Ø${v.dT} · ${L('كانات','Stirrups')} Ø${v.ds} @ ${fmt(v.s)}`);
  s+=T(W/2,yB+44,`${L('تثبيت','Anchorage')} 40Ø = ${fmt(an,2)} m`);
  return svg(s,L('قطاع طولي في الجسر','Longitudinal section through the beam'));
}

/* ================== excavation & backfill: table rows and section drawing ================== */
// rows in the quantity-table shape: excavation (add only) and backfill (add = excavated, deduct = buried)
function earthRows(M){
  const exc=[],fill=[];
  for(const p of M.parts){const g=earthGeom(numObj(p.inputs)),base={label:p.name,n:g.dims.n,L:g.a,W:g.b,H:g.dims.H};
    exc.push({...base,gross:p.exc,ded:0,net:p.exc});
    fill.push({...base,gross:p.exc,ded:p.buried,net:p.fill});}
  return{exc,fill};
}
// finishes rows for the table: one per type, faces noted in the description when more than one
function finRows(M){
  return M.parts.map(p=>({label:p.name,...p.fin}));
}
function drawEarth(v){
  v=numObj(v);
  const W=380,Hh=270,g=earthGeom(v),d=v.dep,trench=v.kind===2;
  const bot=g.b,top=g.top[1];                     // cut across the width
  const sc=Math.min(300/(top+.6),180/(d+.25));
  const cx=W/2,yG=50,yB=yG+d*sc,ink='var(--ink)',mut='var(--muted)';
  const T=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" fill="${mut}" font-family="IBM Plex Mono,monospace" font-size="10.5" text-anchor="${a}">${t}</text>`;
  let s='';
  // ground line with hatching on both sides of the pit
  const gl=cx-top*sc/2,gr=cx+top*sc/2;
  s+=`<line x1="10" y1="${yG}" x2="${gl}" y2="${yG}" stroke="${ink}" stroke-width="1.4"/><line x1="${gr}" y1="${yG}" x2="${W-10}" y2="${yG}" stroke="${ink}" stroke-width="1.4"/>`;
  for(let x=14;x<gl-4;x+=10)s+=`<line x1="${x}" y1="${yG}" x2="${x-6}" y2="${yG+6}" stroke="${mut}"/>`;
  for(let x=gr+8;x<W-10;x+=10)s+=`<line x1="${x}" y1="${yG}" x2="${x-6}" y2="${yG+6}" stroke="${mut}"/>`;
  // pit (backfill colour) — trapezoid when the sides slope
  s+=`<polygon points="${gl},${yG} ${gr},${yG} ${cx+bot*sc/2},${yB} ${cx-bot*sc/2},${yB}" fill="var(--accent-soft)" stroke="${ink}" stroke-width="1.4"/>`;
  if(trench){
    // whole building: the footprint sits inside the working space; buried structures shown as one dashed band
    const bw=Math.max(10,bot*sc-8),bh=Math.min(d*.45,.8)*sc;
    s+=`<rect x="${cx-bw/2}" y="${yB-bh}" width="${bw}" height="${bh}" fill="var(--surface)" stroke="${ink}" stroke-width="1.2" stroke-dasharray="5 3"/>`;
    s+=T(cx,yB-bh/2+4,`${L('منشآت مدفونة','Buried structures')} ${f3(v.bv)} m³`);
    s+=T(cx,yG-6,+v.by===2?`${L('مساحة المبنى','Building area')} ${fmt(v.gA)} m²`:`${L('المبنى','Building')} ${fmt(v.gL)} × ${fmt(v.gW)} m`);
  }else{
    // buried structure: blinding, footing, column neck up to ground
    const bt=v.bt/100,proj=bt>0?.2:0;
    const sw=v.fW*sc,sh=v.fD/100*sc;
    if(bt>0)s+=`<rect x="${cx-sw/2-proj/2*sc}" y="${yB-bt*sc}" width="${sw+proj*sc}" height="${bt*sc}" fill="var(--line-2)" stroke="${ink}"/>`;
    s+=`<rect x="${cx-sw/2}" y="${yB-bt*sc-sh}" width="${sw}" height="${sh}" fill="var(--surface)" stroke="${ink}" stroke-width="1.4"/>`;
    if(v.cb>0){const nw=v.cb/100*sc,yTop=yB-bt*sc-sh;if(yTop>yG)s+=`<rect x="${cx-nw/2}" y="${yG-6}" width="${nw}" height="${yTop-yG+6}" fill="var(--surface)" stroke="${ink}" stroke-width="1.4"/>`}
  }
  s+=dimV(yG,yB,gl-14,fmt(d)+' m')+dimH(cx-bot*sc/2,cx+bot*sc/2,yB+18,fmtF(bot,2)+' m');
  if(v.sl>0)s+=dimH(gl,gr,yG-14,fmtF(top,2)+' m');

    const d=-dx*.008;V3.theta+=d;V3.vel=V3.vel*.5+d*.5;   // remember the hand's speed for the throw
    V3.phi=Math.min(1.5,Math.max(.15,V3.phi-dy*.008))});
  const up=()=>{drag=null;V3.dragging=false;el.style.cursor='';
    V3.vel=Math.max(-.08,Math.min(.08,V3.vel))};          // cap a hard flick
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();V3.dist=Math.min(V3.size*6,Math.max(V3.size*.7,V3.dist*(1+e.deltaY*.001)))},{passive:false});

const steelDesc=b=>b.st||!b.role?b.label:`${b.label} — ${b.role}`;
// bars of one type with the same diameter and length read as one line (e.g. X and Y bars of a column)
function mergeBars(rows){
  const out=[],idx={};
  for(const b of rows){const k=`${b.label}|${b.d}|${b.len.toFixed(3)}`;
    if(k in idx){const m=out[idx[k]];m.count+=b.count;m.kg+=b.kg;if(m.role!==b.role)m.role=null}
    else{idx[k]=out.length;out.push({...b})}}
  // a type with a single main-bar line needs no bar-kind suffix
  for(const m of out)if(out.filter(o=>o.label===m.label).length===1)m.role=null;
  return out;
}
function steelSplit(rows,elTitle){
  const main=mergeBars(rows.filter(b=>!b.st)),st=rows.filter(b=>b.st);
  return[main.length?{title:L('بالطن حديد تسليح لزوم ','Reinforcing steel for ')+elTitle+L('',', per tonne'),rows:main}:null,
    st.length?{title:L('بالطن كانات لزوم ','Stirrups for ')+elTitle+L('',', per tonne'),rows:st}:null].filter(Boolean);
}

/* construction skyline drawn on canvas: static layers cached, cranes animated in between */
let skyRAF=0;
function initSky(){
  cancelAnimationFrame(skyRAF);
  const cv=document.getElementById('sky');if(!cv)return;
  const ctx=cv.getContext('2d');
  const still=reducedMotion();
  const seeded=seed=>()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
  let W=0,H=0,back,front,cranes=[];
  function layer(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.setTransform(cv.width/W,0,0,cv.height/H,0,0);return[c,x]}
  function build(){
    const dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth||1;H=cv.clientHeight||1;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const r=seeded(11);
    // back: sky, sun haze, far skyline
    let b;[back,b]=layer();
    const g=b.createLinearGradient(0,0,0,H);
    // sky graded from the dark colour up into a dusty tint of the main colour
    const P=palette(),dk=P.charcoal,br=P.brand,dust='#B8A891';
    g.addColorStop(0,mix(dk,'#000000',.1));g.addColorStop(.45,mix(mix(dk,br,.35),dust,.25));g.addColorStop(.8,mix(br,dust,.55));g.addColorStop(1,mix(br,'#E2D6C2',.6));
    b.fillStyle=g;b.fillRect(0,0,W,H);
    const sun=b.createRadialGradient(W*.72,H*.32,0,W*.72,H*.32,H*.7);
    sun.addColorStop(0,'rgba(255,224,170,.35)');sun.addColorStop(1,'rgba(255,224,170,0)');b.fillStyle=sun;b.fillRect(0,0,W,H);
    b.fillStyle=mix(dk,br,.22)+'8C';
    for(let x=-20;x<W+20;){const w=36+r()*80,h=H*(.16+r()*.3);b.fillRect(x,H-h,w,h);x+=w*.85}
    // front: near buildings with a few lit windows
    let f;[front,f]=layer();
    for(let x=-30;x<W+30;){
      const w=60+r()*130,h=H*(.1+r()*.38),y=H-h,seed=Math.floor(r()*997);
      f.fillStyle='#1F1A14';f.fillRect(x,y,w,h);
      f.fillStyle='rgba(255,255,255,.035)';f.fillRect(x,y,3,h);
      for(let wy=y+10,j=0;wy<H-8;wy+=13,j++)for(let wx=x+8,i=0;wx<x+w-10;wx+=10,i++){
        const lit=(i*31+j*17+seed)%13===0;
        f.fillStyle=lit?'rgba(255,205,130,.75)':'rgba(255,255,255,.035)';f.fillRect(wx,wy,5,7);
      }
      x+=w+4+r()*18;
    }
    cranes=[.16,.5,.83].map((p,i)=>({x:W*p+(r()-.5)*W*.05,h:H*(.6+r()*.18),jib:Math.min(W*.2,260)*(.8+r()*.4)*(i%2?-1:1),ph:r()*6.28,sp:.00018+r()*.00014}));
  }
  function crane(c,t,col){
    const x=c.x,top=H-c.h,m=5;
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.3;ctx.beginPath();
    ctx.moveTo(x-m,H);ctx.lineTo(x-m,top);ctx.moveTo(x+m,H);ctx.lineTo(x+m,top);
    for(let y=H,k=0;y>top;y-=12,k++){ctx.moveTo(x-m,y);ctx.lineTo(x+m,y-12);ctx.moveTo(x-m,y-12);ctx.lineTo(x+m,y-12)}
    const tip=x+c.jib,back=x-c.jib*.32,dir=Math.sign(c.jib);
    // jib (two chords + lattice) and counter-jib
    ctx.moveTo(x,top);ctx.lineTo(tip,top);ctx.moveTo(x,top+8);ctx.lineTo(tip-dir*6,top+8);
    for(let s=x;dir>0?s<tip-6:s>tip+6;s+=dir*12){ctx.moveTo(s,top+8);ctx.lineTo(s+dir*6,top);ctx.lineTo(s+dir*12,top+8)}
    ctx.moveTo(x,top);ctx.lineTo(back,top);
    // apex and pendants
    ctx.moveTo(x,top);ctx.lineTo(x,top-26);ctx.lineTo(tip,top);ctx.moveTo(x,top-26);ctx.lineTo(back,top);
    ctx.stroke();
    ctx.fillRect(Math.min(back,back+dir*22),top+1,22,12);       // counterweight
    ctx.fillRect(x-(dir>0?12:-2),top+8,10,9);                   // cab
    // trolley + hook + load
    const p=.3+.5*(.5+.5*Math.sin(t*c.sp+c.ph));
    const tx=x+c.jib*p,len=c.h*(.18+.22*(.5+.5*Math.sin(t*c.sp*.7+c.ph*2)));
    ctx.fillRect(tx-5,top+8,10,4);
    ctx.beginPath();ctx.moveTo(tx,top+12);ctx.lineTo(tx,top+12+len);ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#2B241B';ctx.fillRect(tx-9,top+12+len,18,10);
  }
  let last=0;
  function frame(t){
    if(!cv.isConnected)return;
    if(t-last>=33||still){last=t;
      const col=getComputedStyle(document.documentElement).getPropertyValue('--brand').trim()||'#FFC21A';
      ctx.drawImage(back,0,0,W,H);
      ctx.globalAlpha=.88;for(const c of cranes)crane(c,t,col);ctx.globalAlpha=1;
      ctx.drawImage(front,0,0,W,H);
    }
    if(!still)skyRAF=requestAnimationFrame(frame);
  }
  build();frame(0);
  initSky.rebuild=()=>{if(cv.isConnected){build();if(still)frame(0)}};
}

document.addEventListener('pointerdown',e=>{
  if(!e.target.closest)return;
  if(!e.target.closest('.rz-panel.editing'))endPanelEdit();
  const h=e.target.closest('.rz-panel.editing .rz');if(!h)return;
  e.preventDefault();
  const p=h.closest('.rz-panel'),grid=p.parentElement,mode=h.dataset.rz;
  const rtl=getComputedStyle(p).direction==='rtl';
  const sx=e.clientX,sy=e.clientY,sw=p.offsetWidth,sh=p.offsetHeight,gw=grid.clientWidth;
  h.setPointerCapture(e.pointerId);p.classList.add('dragging');
  const move=ev=>{
    if(mode!=='y'){
      // width snaps between half and full row; the side handle sits on the inline-end edge
      const dx=(ev.clientX-sx)*(rtl?-1:1),w=sw+dx;
      const span=w>gw*.62?2:1;if(span!==+p.dataset.span)setSpan(p,span);
    }
    if(mode!=='x'){p.style.height=Math.round(Math.min(PANEL_MAX_H,Math.max(PANEL_MIN_H,sh+ev.clientY-sy)))+'px'}
    fitPanel(p);
  };
  const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);p.classList.remove('dragging');savePanel(p)};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});
document.addEventListener('click',e=>{
